default_engine: goz
recovery_engine: opencode
process_profile: python
opencode_model: glm-5-turbo
claude_enabled: true
claude_model: claude-opus-4-6
claude_max_turns: 200
pool_usage_cap: null
pool_cost_cap: null
engine_usage_caps: {}
engine_budget_caps: {}
engine_costs:
  codex: 1
  opencode: 1
  gemini: 1
  copilot: 1
  claude: 3
  goz: 1
default_retry_limit: 3
pool_stop_on_failure: false
pool_max_tasks: null
pool_stop_on_execution_limit: false
pool_stop_on_dirty_git: false
pool_selection_policy: dependency_aware
auto_commit: true
engine_fallbacks:
  goz:
  - opencode
  - codex
  - gemini
  opencode:
  - goz
  - codex
  - gemini
  codex:
  - opencode
  - goz
  - gemini
