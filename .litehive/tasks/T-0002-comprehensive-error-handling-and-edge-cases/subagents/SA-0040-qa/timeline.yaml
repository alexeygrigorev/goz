    \ Output tokens generated so far\n    \"\"\"\n\n    output_tokens: int = 0\n\n\
    \n# Union type for all chunk types\nChunk = (\n    ContentBlockStart\n    | ContentBlockDelta\n\
    \    | ContentBlockStop\n    | MessageStart\n    | MessageStop\n    | UsageDelta\n\
    )\n\n\nclass ChatClient:\n    \"\"\"Client for Z.AI Chat API with tool calling\
