    \    partial_json: str | None = None\n\n\n@dataclass\nclass ContentBlockStop:\n\
    \    \"\"\"End of a content block in the stream.\n\n    Attributes:\n        index:\
    \ The index of this content block\n    \"\"\"\n\n    index: int\n\n\n@dataclass\n\
    class MessageStart:\n    \"\"\"Start of the message.\n\n    Attributes:\n    \
    \    id: Message ID\n        model: Model name\n        usage_input_tokens: Input\
    \ tokens from message_start.usage\n        usage_cache_read: Cache read tokens\
    \ from message_start.usage\n        usage_cache_creation: Cache creation tokens\
    \ from message_start.usage\n    \"\"\"\n\n    id: str\n    model: str\n    usage_input_tokens:\
    \ int = 0\n    usage_cache_read: int = 0\n    usage_cache_creation: int = 0\n\n\
    \n@dataclass\nclass MessageStop:\n    \"\"\"End of the message.\n\n    Attributes:\n\
    \        stop_reason: Reason for stopping (\"end_turn\", \"max_tokens\", \"tool_use\"\
