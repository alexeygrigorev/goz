  tool_output: "\"\"\"Chat API Client for Z.AI (Issue 17).\n\nThis module provides\
    \ the ChatClient class for interacting with the Z.AI\nchat API using the Anthropic\
    \ SDK with tool calling support.\n\nAcceptance Criteria:\n1. ChatClient class\
    \ exists in goz/agent/chat_client.py\n2. Uses existing Anthropic SDK (same as\
    \ Vision API)\n3. Uses config.zai_token and config.zai_base_url\n4. chat_completion()\
    \ method sends messages and returns async iterator\n5. Supports tools parameter\
    \ for function calling\n6. Supports tool_choice parameter (\"auto\", \"any\")\n\
    7. Supports stream parameter (True/False)\n8. Response chunks yield text deltas\n\
    9. Tool calls are properly formatted in stream\n10. Errors raised as appropriate\
    \ exceptions (AuthError, ApiError, etc.)\n11. Timeout configurable via config\n\
    \"\"\"\nimport asyncio\nimport json\nfrom dataclasses import dataclass\nfrom typing\
    \ import Any, AsyncIterator, Literal\n\nimport anthropic\nfrom anthropic import\
    \ AsyncAnthropic\n\nfrom goz.api.errors import AuthError, ApiError, NetworkError,\
    \ TimeoutError, ZaiError\nfrom goz.config import Config\n\n\n# Chunk types for\
    \ streaming responses (from spec)\n@dataclass\nclass ContentBlockStart:\n    \"\
    \"\"Start of a content block in the stream.\n\n    Attributes:\n        type:\
    \ The type of content block (\"text\" or \"tool_use\")\n        index: The index\
    \ of this content block\n        id: Tool call ID (only for tool_use type)\n \
    \       name: Tool name (only for tool_use type)\n    \"\"\"\n    type: Literal[\"\
    text\", \"tool_use\"]\n    index: int\n    id: str | None = None\n    name: str\
    \ | None = None\n\n\n@dataclass\nclass ContentBlockDelta:\n    \"\"\"Delta for\
    \ a content block in the stream.\n\n    Attributes:\n        type: The type of\
    \ delta (\"text_delta\" or \"input_json_delta\")\n        index: The index of\
    \ this content block\n        text: Text content (only for text_delta type)\n\
    \        partial_json: Partial JSON string (only for input_json_delta type)\n\
    \    \"\"\"\n    type: Literal[\"text_delta\", \"input_json_delta\"]\n    index:\
    \ int\n    text: str | None = None\n    partial_json: str | None = None\n\n\n\
    @dataclass\nclass ContentBlockStop:\n    \"\"\"End of a content block in the stream.\n\
    \n    Attributes:\n        index: The index of this content block\n    \"\"\"\n\
    \    index: int\n\n\n@dataclass\nclass MessageStart:\n    \"\"\"Start of the message.\n\
    \n    Attributes:\n        id: Message ID\n        model: Model name\n    \"\"\
    \"\n    id: str\n    model: str\n\n\n@dataclass\nclass MessageStop:\n    \"\"\"\
    End of the message.\n\n    Attributes:\n        stop_reason: Reason for stopping\
    \ (\"end_turn\", \"max_tokens\", \"tool_use\")\n    \"\"\"\n    stop_reason: Literal[\"\
    end_turn\", \"max_tokens\", \"tool_use\"]\n\n\n# Union type for all chunk types\n\
    Chunk = ContentBlockStart | ContentBlockDelta | ContentBlockStop | MessageStart\
    \ | MessageStop\n\n\nclass ChatClient:\n    \"\"\"Client for Z.AI Chat API with\
    \ tool calling support.\n\n    This client uses the Anthropic SDK to interact\
    \ with the Z.AI chat API,\n    supporting streaming responses, tool calling, and\
    \ various generation\n    parameters.\n\n    Attributes:\n        config: Configuration\
    \ object containing API credentials and settings\n        _client: Internal AsyncAnthropic\
    \ client instance\n    \"\"\"\n\n    def __init__(self, config: Config | None\
    \ = None) -> None:\n        \"\"\"Initialize ChatClient.\n\n        Args:\n  \
    \          config: Optional config object. If not provided, loads from default\
    \ location.\n\n        Acceptance Criteria:\n        - Uses config.zai_token and\
    \ config.zai_base_url (AC 3)\n        - Uses AsyncAnthropic from existing SDK\
    \ (AC 2)\n        - Timeout is configurable via config (AC 11)\n        \"\"\"\
    \n        if config is None:\n            from goz.config import load_config\n\
    \            config = load_config()\n\n        self.config = config\n\n      \
    \  # Initialize async Anthropic client (same pattern as VisionClient)\n      \
    \  self._client = AsyncAnthropic(\n            api_key=self.config.zai_token,\n\
    \            base_url=self.config.zai_base_url,\n            timeout=self.config.timeout,\n\
    \        )\n        self.max_retries = 3\n        self.base_retry_delay = 1.0\n\
    \n    async def chat_completion(\n        self,\n        messages: list[dict],\n\
    \        tools: list[dict] | None = None,\n        tool_choice: Literal[\"auto\"\
    , \"any\", \"none\"] | dict = \"auto\",\n        stream: bool = True,\n      \
    \  temperature: float | None = None,\n        max_tokens: int | None = None,\n\
    \    ) -> AsyncIterator[Chunk]:\n        \"\"\"Stream chat completion with tool\
    \ calling support.\n\n        Args:\n            messages: Chat history in Anthropic\
    \ format\n            tools: Tool definitions in Anthropic format (optional)\n\
    \            tool_choice: How to select tools (\"auto\", \"any\", \"none\", or\
    \ specific tool dict)\n            stream: Whether to stream response (True) or\
    \ wait for complete response (False)\n            temperature: Generation temperature\
    \ (uses config default if None)\n            max_tokens: Max tokens in response\
    \ (uses config default if None)\n\n        Yields:\n            Chunk objects\
    \ from the API response\n\n        Raises:\n            AuthError: For 401/403\
    \ authentication failures\n            ApiError: For other API errors (4xx, 5xx)\n\
    \            NetworkError: For connection failures\n            TimeoutError:\
    \ For request timeouts\n\n        Acceptance Criteria:\n        - Returns async\
    \ iterator (AC 4)\n        - Supports tools parameter (AC 5)\n        - Supports\
    \ tool_choice parameter (AC 6)\n        - Supports stream parameter (AC 7)\n \
    \       - Response chunks yield text deltas (AC 8)\n        - Tool calls properly\
    \ formatted in stream (AC 9)\n        - Errors raised as appropriate exceptions\
    \ (AC 10)\n        \"\"\"\n        # Build request parameters\n        params:\
    \ dict = {\n            \"model\": self.config.chat_model,\n            \"messages\"\
    : messages,\n        }\n\n        # Add optional parameters\n        if tools\
    \ is not None:\n            params[\"tools\"] = tools\n\n        if tool_choice\
    \ != \"auto\":\n            params[\"tool_choice\"] = tool_choice\n\n        if\
    \ temperature is not None:\n            params[\"temperature\"] = temperature\n\
    \        else:\n            params[\"temperature\"] = self.config.temperature\n\
    \n        if max_tokens is not None:\n            params[\"max_tokens\"] = max_tokens\n\
    \        else:\n            params[\"max_tokens\"] = self.config.max_tokens\n\n\
    \        timeout_ms = int(self.config.timeout * 1000)\n\n        for attempt in\
    \ range(self.max_retries + 1):\n            try:\n                if stream:\n\
    \                    async with self._client.messages.stream(**params) as response_stream:\n\
    \                        async for event in response_stream:\n               \
    \             chunk = self._convert_sse_event_to_chunk(event)\n              \
    \              if chunk is not None:\n                                yield chunk\n\
    \                else:\n                    response = await self._client.messages.create(**params)\n\
    \                    async for chunk in self._response_to_chunks(response):\n\
    \                        yield chunk\n                return\n            except\
    \ anthropic.AuthenticationError as e:\n                status_code = getattr(getattr(e,\
    \ \"response\", None), \"status_code\", 401)\n                raise AuthError(\n\
    \                    \"Authentication failed. Check your API token and try again.\"\
    ,\n                    statusCode=status_code,\n                ) from e\n   \
    \         except anthropic.APITimeoutError as e:\n                timeout_error\
    \ = TimeoutError(timeoutMs=timeout_ms)\n                if attempt >= self.max_retries:\n\
    \                    raise timeout_error from e\n                await self._sleep_before_retry(attempt)\n\
    \            except anthropic.APIConnectionError as e:\n                network_error\
    \ = NetworkError(\n                    \"Connection failed while contacting the\
    \ API. Check your network and retry.\"\n                )\n                if\
    \ attempt >= self.max_retries:\n                    raise network_error from e\n\
    \                await self._sleep_before_retry(attempt)\n            except anthropic.APIStatusError\
    \ as e:\n                status_code = getattr(e, \"status_code\", None) or getattr(\n\
    \                    getattr(e, \"response\", None), \"status_code\", 500\n  \
    \              )\n                if status_code in (401, 403):\n            \
    \        raise AuthError(\n                        \"Authentication failed. Check\
    \ your API token and try again.\",\n                        statusCode=status_code,\n\
    \                    ) from e\n\n"
