goal: Implement error handling for network errors, API errors, tool errors, session
  errors, UI errors, and edge cases with retry logic and graceful degradation
acceptance_criteria:
- 'Network errors: connection failures, timeouts with retry'
- 'API errors: 401 auth, 429 rate limit, 500 server errors'
- 'Tool errors: input validation, file not found, permission denied'
- Automatic retry with exponential backoff (max 3 retries)
- User-friendly error messages with actionable suggestions
- Context preservation after errors
- Graceful shutdown with unsaved changes prompt
