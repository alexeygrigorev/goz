    \ provides methods for\n    adding messages, converting to API format, and compressing\
    \ old\n    messages when approaching the limit.\n\n    Attributes:\n        messages:\
    \ List of ChatMessage objects\n        max_messages: Maximum number of messages\
    \ before compression\n    \"\"\"\n\n    DEFAULT_MAX_MESSAGES: int = 50\n    COMPRESS_THRESHOLD:\
    \ float = 0.8  # Compress at 80% capacity\n\n    def __init__(\n        self,\n\
    \        max_messages: int = DEFAULT_MAX_MESSAGES,\n        messages: list[ChatMessage]\
    \ | None = None,\n    ) -> None:\n        \"\"\"Initialize ChatHistory.\n\n  \
    \      Args:\n            max_messages: Maximum messages before compression (default:\
    \ 50)\n            messages: Optional initial list of messages\n        \"\"\"\
    \n        self.max_messages = max_messages\n        self.messages: list[ChatMessage]\
    \ = messages if messages is not None else []\n\n    @property\n    def message_count(self)\
