  tool_output: "\"\"\"Z.AI API client for vision, search, and reader.\n\nFollowing\
    \ TDD: tests are written first, then implementation follows.\n\"\"\"\nfrom __future__\
    \ import annotations\n\nimport asyncio\nimport json\nimport logging\nimport os\n\
    from typing import Any\n\nimport httpx\n\nfrom goz.api.errors import ApiError,\
    \ AuthError, NetworkError, TimeoutError, ZaiError\nfrom goz.config import Config,\
    \ load_config\n\n\n# Logger for API requests\nlogger = logging.getLogger(__name__)\n\
    \n\ndef with_retry(max_retries: int = 2, base_delay: float = 1.0):\n    \"\"\"\
    Decorator for retry logic with exponential backoff.\n\n    Args:\n        max_retries:\
    \ Maximum number of retry attempts (default: 2)\n        base_delay: Base delay\
    \ in seconds (default: 1.0)\n\n    Returns:\n        Decorator function\n    \"\
    \"\"\n    def decorator(fn):\n        async def wrapper(*args, **kwargs):\n  \
    \          last_error: Exception | None = None\n\n            for attempt in range(max_retries\
    \ + 1):\n                try:\n                    return await fn(*args, **kwargs)\n\
    \                except AuthError:\n                    # Don't retry auth errors\n\
    \                    raise\n                except Exception as e:\n         \
    \           last_error = e\n\n                    # Don't retry on last attempt\n\
    \                    if attempt == max_retries:\n                        break\n\
    \n                    # Exponential backoff\n                    delay = base_delay\
    \ * (2 ** attempt)\n                    await asyncio.sleep(delay)\n\n       \
    \     raise last_error\n        return wrapper\n    return decorator\n\n\nclass\
    \ ZaiApiClient:\n    \"\"\"Z.AI API client.\n\n    This client handles HTTP requests\
    \ to the Z.AI API with retry logic,\n    error handling, and optional logging.\n\
    \    \"\"\"\n\n    def __init__(\n        self,\n        config: Config | None\
    \ = None,\n        enable_logging: bool | None = None,\n    ) -> None:\n     \
    \   \"\"\"Initialize ZaiApiClient.\n\n        Args:\n            config: Optional\
    \ Config object. If not provided, loads from default location.\n            enable_logging:\
    \ Optional flag to enable logging. If not provided, checks\n                GOZ_API_LOG\
    \ environment variable.\n        \"\"\"\n        self.config = config or load_config()\n\
    \n        # Enable logging if explicitly set or GOZ_API_LOG env var is set\n \
    \       if enable_logging is None:\n            enable_logging = os.getenv(\"\
    GOZ_API_LOG\", \"\").lower() in (\"1\", \"true\", \"yes\")\n        self.enable_logging\
    \ = enable_logging\n\n    @with_retry(max_retries=2, base_delay=1.0)\n    async\
    \ def request(\n        self,\n        endpoint: str,\n        body: dict[str,\
    \ Any],\n    ) -> dict[str, Any]:\n        \"\"\"Make an HTTP POST request to\
    \ the API.\n\n        Args:\n            endpoint: API endpoint path (e.g., '/chat/completions')\n\
    \            body: Request body as dictionary\n\n        Returns:\n          \
    \  Parsed JSON response as dictionary\n\n        Raises:\n            AuthError:\
    \ For 401/403 responses\n            ApiError: For other 4xx/5xx responses\n \
    \           TimeoutError: For request timeouts\n            NetworkError: For\
    \ network failures\n        \"\"\"\n        url = f\"{self.config.zai_base_url}{endpoint}\"\
    \n        timeout_ms = self.config.timeout * 1000\n\n        if self.enable_logging:\n\
    \            logger.debug(\"-> POST %s (%d bytes)\", endpoint, len(json.dumps(body)))\n\
    \n        try:\n            async with httpx.AsyncClient(timeout=self.config.timeout)\
    \ as client:\n                response = await client.post(\n                \
    \    url,\n                    json=body,\n                    headers={\n   \
    \                     \"Authorization\": f\"Bearer {self.config.zai_token}\",\n\
    \                        \"Content-Type\": \"application/json\",\n           \
    \             \"Accept-Language\": \"en-US,en\",\n                    },\n   \
    \             )\n\n                if self.enable_logging:\n                 \
    \   logger.debug(\n                        \"<- %d %d bytes\",\n             \
    \           response.status_code,\n                        len(response.content),\n\
    \                    )\n\n                # Handle error responses\n         \
    \       if not response.is_success:\n                    self._handle_error_response(response)\n\
    \n                # Return parsed JSON\n                return response.json()\n\
    \n        except asyncio.TimeoutError as e:\n            if self.enable_logging:\n\
    \                logger.error(\"! TimeoutError: Request timed out after %dms\"\
    , timeout_ms)\n            raise TimeoutError(timeout_ms) from e\n        except\
    \ httpx.TimeoutException as e:\n            if self.enable_logging:\n        \
    \        logger.error(\"! TimeoutException: Request timed out after %dms\", timeout_ms)\n\
    \            raise TimeoutError(timeout_ms) from e\n        except httpx.ConnectError\
    \ as e:\n            if self.enable_logging:\n                logger.error(\"\
    ! NetworkError: %s\", e)\n            raise NetworkError(str(e)) from e\n    \
    \    except httpx.NetworkError as e:\n            if self.enable_logging:\n  \
    \              logger.error(\"! NetworkError: %s\", e)\n            raise NetworkError(str(e))\
    \ from e\n        except AuthError:\n            # Re-raise AuthError as-is\n\
    \            raise\n        except ZaiError:\n            # Re-raise other ZaiErrors\
    \ as-is\n            raise\n        except Exception as e:\n            if self.enable_logging:\n\
    \                logger.error(\"! %s: %s\", type(e).__name__, e)\n           \
    \ raise\n\n    def _handle_error_response(self, response: httpx.Response) -> None:\n\
    \        \"\"\"Handle error response from API.\n\n        Args:\n            response:\
    \ HTTP response object\n\n        Raises:\n            AuthError: For 401/403\
    \ responses\n            ApiError: For other error responses\n        \"\"\"\n\
    \        status_code = response.status_code\n\n        # Try to parse error message\
    \ from JSON\n        error_message = self._parse_error_message(response)\n\n \
    \       if self.enable_logging:\n            logger.error(\"! %d: %s\", status_code,\
    \ error_message)\n\n        # Raise appropriate error based on status code\n \
    \       if status_code in (401, 403):\n            raise AuthError(error_message,\
    \ statusCode=status_code)\n        else:\n            raise ApiError(error_message,\
    \ statusCode=status_code)\n\n    def _parse_error_message(self, response: httpx.Response)\
    \ -> str:\n        \"\"\"Parse error message from response.\n\n        Handles\
    \ nested error structures like:\n        - {\"error\": {\"message\": \"...\"}}\n\
    \        - {\"message\": \"...\"}\n        - {\"error\": \"...\"}\n\n        Args:\n\
    \            response: HTTP response object\n\n        Returns:\n            Extracted\
    \ error message\n        \"\"\"\n        try:\n            data = response.json()\n\
    \n            # Try nested error.message\n            if isinstance(data.get(\"\
    error\"), dict):\n                msg = data[\"error\"].get(\"message\")\n   \
    \             if msg:\n                    return msg if isinstance(msg, str)\
    \ else json.dumps(msg)\n\n            # Try top-level message\n            if\
    \ \"message\" in data:\n                msg = data[\"message\"]\n            \
    \    return msg if isinstance(msg, str) else json.dumps(msg)\n\n            #\
    \ Try error field\n            if \"error\" in data:\n                msg = data[\"\
    error\"]\n                return msg if isinstance(msg, str) else json.dumps(msg)\n\
    \n        except (json.JSONDecodeError, ValueError):\n            # Not JSON,\
    \ use text as-is\n            pass\n\n        return response.text or f\"HTTP\
    \ {response.status_code}\"\n"
