  tool_output: "\"\"\"Tool registry for goz interactive coding agent.\n\nThis module\
    \ provides the ToolRegistry class for managing available tools.\n\"\"\"\nfrom\
    \ __future__ import annotations\n\nfrom typing import TYPE_CHECKING\n\nfrom goz.agent.tools.base\
    \ import Tool, ToolNotFoundError\n\nif TYPE_CHECKING:\n    from collections.abc\
    \ import Set\n\n\nclass ToolRegistry:\n    \"\"\"Registry for managing available\
    \ tools.\n\n    The ToolRegistry stores tool implementations and provides methods\n\
    \    for registering, retrieving, and listing tools. It also supports\n    exporting\
    \ tool definitions to OpenAI function-calling format.\n\n    Attributes:\n   \
    \     _tools: Internal storage for registered tools\n    \"\"\"\n\n    def __init__(self)\
    \ -> None:\n        \"\"\"Initialize empty registry.\"\"\"\n        self._tools:\
    \ dict[str, Tool] = {}\n\n    def register(self, tool: Tool) -> None:\n      \
    \  \"\"\"Register a tool.\n\n        Args:\n            tool: Tool instance to\
    \ register\n\n        Raises:\n            ValueError: If a tool with the same\
    \ name is already registered\n        \"\"\"\n        name = tool.name\n     \
    \   if name in self._tools:\n            raise ValueError(f\"Tool '{name}' is\
    \ already registered\")\n        self._tools[name] = tool\n\n    def unregister(self,\
    \ name: str) -> None:\n        \"\"\"Unregister a tool.\n\n        Args:\n   \
    \         name: Name of the tool to unregister\n\n        Note:\n            Does\
    \ not raise if tool is not found (idempotent operation)\n        \"\"\"\n    \
    \    self._tools.pop(name, None)\n\n    def get(self, name: str) -> Tool | None:\n\
    \        \"\"\"Get tool by name.\n\n        Args:\n            name: Name of the\
    \ tool to retrieve\n\n        Returns:\n            Tool instance if found, None\
    \ otherwise\n        \"\"\"\n        return self._tools.get(name)\n\n    def list_all(self)\
    \ -> list[Tool]:\n        \"\"\"List all registered tools.\n\n        Returns:\n\
    \            List of all registered Tool instances\n        \"\"\"\n        return\
    \ list(self._tools.values())\n\n    def to_openai_schema(self) -> list[dict]:\n\
    \        \"\"\"Export tools to OpenAI function-calling format.\n\n        Converts\
    \ all registered tools to the format expected by OpenAI's\n        function calling\
    \ API. Each tool is represented as a dict with\n        name, description, and\
    \ parameters (input_schema).\n\n        Returns:\n            List of dicts with\
    \ keys: name, description, parameters\n\n        Example:\n            >>> schema\
    \ = registry.to_openai_schema()\n            >>> schema[0]\n            {\n  \
    \              \"name\": \"read_file\",\n                \"description\": \"Read\
    \ contents of a file\",\n                \"parameters\": {\n                 \
    \   \"type\": \"object\",\n                    \"properties\": {\n           \
    \             \"path\": {\"type\": \"string\"}\n                    },\n     \
    \               \"required\": [\"path\"]\n                }\n            }\n \
    \       \"\"\"\n        result = []\n        for tool in self.list_all():\n  \
    \          result.append({\n                \"name\": tool.name,\n           \
    \     \"description\": tool.description,\n                \"parameters\": tool.input_schema,\n\
    \            })\n        return result\n\n    @property\n    def tool_names(self)\
    \ -> Set[str]:\n        \"\"\"Get set of registered tool names.\n\n        Returns:\n\
    \            Set containing the names of all registered tools\n        \"\"\"\n\
    \        return set(self._tools.keys())\n"
