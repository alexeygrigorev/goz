    \ input after a short delay to ensure widget is ready\n        self.set_timer(0.1,\
    \ self._focus_input)\n\n    def _focus_input(self) -> None:\n        \"\"\"Focus\
    \ the input widget.\"\"\"\n        try:\n            input_widget = self.query_one(\"\
    #input\", Input)\n            input_widget.focus()\n        except:\n        \
    \    pass\n\n    def on_screen_resume(self) -> None:\n        \"\"\"Called when\
    \ screen is resumed - focus input.\"\"\"\n        self._focus_input()\n\n    def\
    \ show_welcome(self) -> None:\n        \"\"\"Show welcome message.\"\"\"\n   \
    \     history = self.query_one(ChatHistoryViewer)\n        self._welcome_widget\
    \ = history.add_system_message(\"\"\"Welcome to goz!\n\nI'm your AI coding assistant.\
    \ I can help you:\n- Read and analyze code\n- Create and modify files\n- Run terminal\
