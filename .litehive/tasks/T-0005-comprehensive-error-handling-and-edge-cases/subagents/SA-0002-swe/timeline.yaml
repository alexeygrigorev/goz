    \ File path (relative or absolute)\n\n        Returns:\n            Resolved absolute\
    \ Path\n        \"\"\"\n        path = Path(file_path)\n\n        # If relative,\
    \ resolve against working_dir\n        if not path.is_absolute():\n          \
    \  path = Path(self.working_dir) / path\n\n        return path.resolve()\n\n \
    \   def _format_output(\n        self,\n        file_path: Path,\n        lines:\
    \ list[str],\n        total_lines: int,\n        display_range: str = \"\"\n \
    \   ) -> str:\n        \"\"\"Format file output with line numbers.\n\n       \
