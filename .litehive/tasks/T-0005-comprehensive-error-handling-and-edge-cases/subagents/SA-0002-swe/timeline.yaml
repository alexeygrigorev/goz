  tool_output: "# Issue 32: Error Handling + Edge Cases\n\n## Status\n.todo\n\n##\
    \ Description\nImplement comprehensive error handling for all agent operations\
    \ and edge cases.\n\n## User Scenarios\n\n### Scenario 1: Network Error During\
    \ Chat\n- User sends message\n- Network connection drops\n- Agent shows: \"Connection\
    \ error. Retrying...\"\n- Retry succeeds\n- Response continues normally\n- User\
    \ sees minimal disruption\n\n### Scenario 2: API Rate Limit\n- User sends many\
    \ messages quickly\n- API returns 429 rate limit\n- Agent shows: \"Rate limited.\
    \ Waiting before retry...\"\n- Waits appropriate time\n- Retries automatically\n\
    - Continues conversation\n\n### Scenario 3: Invalid Tool Input\n- Agent calls\
    \ tool with invalid input\n- Tool raises ToolInputError\n- Error message shown\
    \ to user\n- Agent asks for clarification\n- User provides correct input\n- Tool\
    \ succeeds\n\n### Scenario 4: File Permission Error\n- Agent tries to edit read-only\
    \ file\n- Tool raises PermissionError\n- Error shown: \"Cannot edit file: permission\
    \ denied\"\n- Agent suggests checking file permissions\n- User fixes permissions\n\
    - Continues\n\n### Scenario 5: Tool Timeout\n- Agent runs long bash command\n\
    - Command exceeds timeout\n- TimeoutError raised\n- Error shown: \"Command timed\
    \ out after 300s\"\n- Agent suggests breaking into smaller tasks\n- User continues\n\
    \n### Scenario 6: Corrupted Session\n- User tries to load corrupted session\n\
    - JSON decode error\n- Clear error shown: \"Session file is corrupted\"\n- User\
    \ advised to delete and start fresh\n- No crash\n\n### Scenario 7: Out of Context\n\
    - Long conversation exceeds context window\n- History compression triggers\n-\
    \ Old messages summarized\n- Conversation continues\n- User may notice summary\
    \ in history\n\n### Scenario 8: Invalid Agent Type\n- User types: `/agent nonexistent`\n\
    - Error shown: \"Unknown agent type: nonexistent\"\n- List of valid types shown\n\
    - User can try again\n- No crash\n\n### Scenario 9: Empty Input\n- User presses\
    \ Enter with no text\n- Input is ignored\n- No API call made\n- User stays in\
    \ chat\n\n### Scenario 10: Very Long Input\n- User pastes 10000 characters\n-\
    \ Input is accepted\n- Sent to API\n- API handles as configured\n- If too long,\
    \ API returns error\n- Error shown to user\n\n## Acceptance Criteria\n\n### Network\
    \ Errors\n1. Connection errors show user-friendly message\n2. Timeout errors show\
    \ timeout duration\n3. Retry logic works correctly\n4. Max retries respected\n\
    5. After max retries, user is informed\n6. User can retry manually\n\n### API\
    \ Errors\n7. 401 errors show authentication message\n8. 429 errors show rate limit\
    \ message\n9. 500 errors show server error message\n10. Error messages include\
    \ actionable suggestions\n11. No crashes on API errors\n\n### Tool Errors\n12.\
    \ ToolInputError shows which field was invalid\n13. FileNotFoundError shows file\
    \ path\n14. PermissionError shows operation that failed\n15. TimeoutError shows\
    \ timeout duration\n16. ToolExecutionError shows tool name and error\n\n### Session\
    \ Errors\n17. Corrupted session shows decode error\n18. Non-existent session shows\
    \ not found\n19. Permission denied shows path\n20. Create session directory if\
    \ missing\n21. Handle disk full errors\n\n### UI Errors\n22. TUI doesn't freeze\
    \ on errors\n23. Errors shown in visible notifications\n24. Long error messages\
    \ are scrollable\n25. User can dismiss error dialogs\n26. Error states clear automatically\n\
    \n### Edge Cases\n27. Empty input is ignored\n28. Whitespace-only input is ignored\n\
    29. Very long input is handled\n30. Special characters in input preserved\n31.\
    \ Unicode input handled correctly\n32. Concurrent input handling\n\n### Recovery\n\
    33. User can continue after error\n34. Context preserved after recoverable errors\n\
    35. Clear button works during errors\n36. Quit works during errors\n37. No resource\
    \ leaks on errors\n\n## Technical Details\n\n### File Structure\n```\ngoz/agent/\n\
    \u2514\u2500\u2500 errors.py    # Agent-specific error classes\n\ngoz/agent/tui/\n\
    \u2514\u2500\u2500 widgets/\n    \u2514\u2500\u2500 errors.py    # Error display\
    \ widgets\n```\n\n### Agent Error Classes\n```python\n# goz/agent/errors.py\n\n\
    class AgentError(ZaiError):\n    \"\"\"Base error for agent operations.\"\"\"\n\
    \nclass ContextWindowExceededError(AgentError):\n    \"\"\"Chat history exceeds\
    \ context window.\"\"\"\n\nclass ToolExecutionError(AgentError):\n    \"\"\"Tool\
    \ execution failed.\"\"\"\n\n    def __init__(self, tool_name: str, message: str):\n\
    \        self.tool_name = tool_name\n        super().__init__(f\"{tool_name}:\
    \ {message}\")\n\nclass SessionCorruptedError(AgentError):\n    \"\"\"Session\
    \ file is corrupted.\"\"\"\n\nclass RetryableError(AgentError):\n    \"\"\"Error\
    \ that can be retried.\"\"\"\n\nclass MaxRetriesExceededError(AgentError):\n \
    \   \"\"\"Maximum retries exceeded.\"\"\"\n```\n\n### Error Handler\n```python\n\
    # goz/agent/error_handler.py\n\nclass ErrorHandler:\n    \"\"\"Centralized error\
    \ handling for agent.\"\"\"\n\n    def __init__(self, notifier: Callable[[str,\
    \ str], None]):\n        \"\"\"\n        Args:\n            notifier: Function\
    \ to show notifications (title, message)\n        \"\"\"\n        self.notifier\
    \ = notifier\n\n    async def handle_error(\n        self,\n        error: Exception,\n\
    \        context: str | None = None,\n    ) -> bool:\n        \"\"\"Handle an\
    \ error.\n\n        Args:\n            error: The error to handle\n          \
    \  context: Optional context string\n\n        Returns:\n            True if error\
    \ was recoverable, False otherwise\n        \"\"\"\n        # Network errors -\
    \ retry\n        if isinstance(error, httpx.NetworkError):\n            self.notifier(\n\
    \                \"Network Error\",\n                \"Connection failed. Retrying...\"\
    ,\n            )\n            return True  # Recoverable\n\n        if isinstance(error,\
    \ httpx.TimeoutException):\n            self.notifier(\n                \"Timeout\"\
    ,\n                \"Request timed out. Please try again.\",\n            )\n\
    \            return False  # Not recoverable\n\n"
