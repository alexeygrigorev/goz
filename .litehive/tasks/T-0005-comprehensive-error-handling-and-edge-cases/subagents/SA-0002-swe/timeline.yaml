  tool_output: "\"\"\"Session persistence for the goz agent.\n\nThis module provides\
    \ classes for saving and loading chat sessions:\n- Session: Dataclass for a saved\
    \ chat session\n- SessionInfo: Lightweight metadata about a session\n- SessionManager:\
    \ Manages session files (save, load, list, delete)\n\nAcceptance Criteria:\n-\
    \ AC 1: SessionManager class exists in goz/agent/sessions.py\n- AC 2: save() method\
    \ saves session to file\n- AC 3: load() method loads session from file\n- AC 4:\
    \ list_sessions() returns all sessions\n- AC 5: delete() method deletes session\n\
    - AC 6: exists() checks if session exists\n- AC 7: get_info() returns session\
    \ metadata\n\"\"\"\nimport json\nfrom dataclasses import dataclass, field\nfrom\
    \ datetime import datetime\nfrom pathlib import Path\n\nfrom goz.agent.history\
    \ import ChatMessage\n\n\n@dataclass\nclass Session:\n    \"\"\"A saved chat session.\n\
    \n    Attributes:\n        id: Session identifier (filename without .json)\n \
    \       created_at: When the session was first created\n        updated_at: When\
    \ the session was last modified\n        working_directory: Working directory\
    \ at time of save\n        messages: List of chat messages in the session\n  \
    \      model: Model name used for the session\n        agent_type: Type of agent\
    \ used (e.g., \"general\", \"coder\")\n        config_snapshot: Config settings\
    \ at time of save\n    \"\"\"\n\n    id: str\n    created_at: datetime\n    updated_at:\
    \ datetime\n    working_directory: str\n    messages: list[ChatMessage]\n    model:\
    \ str\n    agent_type: str\n    config_snapshot: dict\n    tool_state: dict =\
    \ field(default_factory=dict)\n\n    def to_dict(self) -> dict:\n        \"\"\"\
    Convert Session to dict for JSON serialization.\n\n        Returns:\n        \
    \    Dict representation of this Session\n        \"\"\"\n        return {\n \
    \           \"id\": self.id,\n            \"created_at\": self.created_at.isoformat(),\n\
    \            \"updated_at\": self.updated_at.isoformat(),\n            \"working_directory\"\
    : self.working_directory,\n            \"messages\": [msg.to_dict() for msg in\
    \ self.messages],\n            \"model\": self.model,\n            \"agent_type\"\
    : self.agent_type,\n            \"config_snapshot\": self.config_snapshot,\n \
    \           \"tool_state\": self.tool_state,\n        }\n\n    @classmethod\n\
    \    def from_dict(cls, data: dict) -> \"Session\":\n        \"\"\"Create Session\
    \ from dict.\n\n        Args:\n            data: Dict representation of Session\n\
    \n        Returns:\n            Session instance\n        \"\"\"\n        return\
    \ cls(\n            id=data[\"id\"],\n            created_at=datetime.fromisoformat(data[\"\
    created_at\"]),\n            updated_at=datetime.fromisoformat(data[\"updated_at\"\
    ]),\n            working_directory=data[\"working_directory\"],\n            messages=[ChatMessage.from_dict(m)\
    \ for m in data[\"messages\"]],\n            model=data[\"model\"],\n        \
    \    agent_type=data[\"agent_type\"],\n            config_snapshot=data.get(\"\
    config_snapshot\", {}),\n            tool_state=data.get(\"tool_state\", {}),\n\
    \        )\n\n\n@dataclass\nclass SessionInfo:\n    \"\"\"Metadata about a session\
    \ (lightweight).\n\n    Attributes:\n        id: Session identifier\n        created_at:\
    \ When the session was first created\n        updated_at: When the session was\
    \ last modified\n        working_directory: Working directory at time of save\n\
    \        message_count: Number of messages in the session\n        model: Model\
    \ name used for the session\n        agent_type: Type of agent used\n    \"\"\"\
    \n\n    id: str\n    created_at: datetime\n    updated_at: datetime\n    working_directory:\
    \ str\n    message_count: int\n    model: str\n    agent_type: str\n\n\nclass\
    \ SessionManager:\n    \"\"\"Manage session persistence.\n\n    This class handles\
    \ saving, loading, listing, and deleting chat sessions.\n    Sessions are stored\
    \ as JSON files in the session directory.\n\n    Attributes:\n        session_dir:\
    \ Directory where session files are stored\n    \"\"\"\n\n    DEFAULT_SESSION_DIR\
    \ = Path.home() / \".goz\" / \"sessions\"\n\n    def __init__(self, session_dir:\
    \ Path | None = None) -> None:\n        \"\"\"Initialize SessionManager.\n\n \
    \       Args:\n            session_dir: Directory for session files (default:\
    \ ~/.goz/sessions)\n        \"\"\"\n        self.session_dir = session_dir or\
    \ self.DEFAULT_SESSION_DIR\n        self.session_dir.mkdir(parents=True, exist_ok=True)\n\
    \n    async def save(self, session: Session) -> Path:\n        \"\"\"Save session\
    \ to file.\n\n        Args:\n            session: Session to save\n\n        Returns:\n\
    \            Path to saved file\n        \"\"\"\n        # Update the timestamp\n\
    \        session.updated_at = datetime.now()\n\n        file_path = self.session_dir\
    \ / f\"{session.id}.json\"\n\n        with open(file_path, \"w\") as f:\n    \
    \        json.dump(session.to_dict(), f, indent=2)\n\n        return file_path\n\
    \n    async def load(self, session_id: str) -> Session:\n        \"\"\"Load session\
    \ from file.\n\n        Args:\n            session_id: Session identifier (without\
    \ .json)\n\n        Returns:\n            Loaded Session\n\n        Raises:\n\
    \            FileNotFoundError: If session doesn't exist\n            ValueError:\
    \ If file is corrupted\n        \"\"\"\n        file_path = self.session_dir /\
    \ f\"{session_id}.json\"\n\n        if not file_path.exists():\n            raise\
    \ FileNotFoundError(f\"Session not found: {session_id}\")\n\n        try:\n  \
    \          with open(file_path) as f:\n                data = json.load(f)\n \
    \           return Session.from_dict(data)\n        except json.JSONDecodeError\
    \ as e:\n            raise ValueError(f\"Corrupted session file: {e}\") from e\n\
    \n    def list_sessions(self) -> list[SessionInfo]:\n        \"\"\"List all saved\
    \ sessions.\n\n        Returns:\n            List of session metadata, sorted\
    \ by updated_at (newest first)\n        \"\"\"\n        sessions: list[SessionInfo]\
    \ = []\n\n        for file_path in self.session_dir.glob(\"*.json\"):\n      \
    \      try:\n                with open(file_path) as f:\n                    data\
    \ = json.load(f)\n\n                sessions.append(\n                    SessionInfo(\n\
    \                        id=data[\"id\"],\n                        created_at=datetime.fromisoformat(data[\"\
    created_at\"]),\n                        updated_at=datetime.fromisoformat(data[\"\
    updated_at\"]),\n                        working_directory=data[\"working_directory\"\
    ],\n                        message_count=len(data[\"messages\"]),\n         \
    \               model=data[\"model\"],\n                        agent_type=data.get(\"\
    agent_type\", \"general\"),\n                    )\n                )\n      \
    \      except (json.JSONDecodeError, KeyError):\n                # Skip corrupted\
    \ files\n                continue\n\n        # Sort by updated_at, newest first\n\
    \        sessions.sort(key=lambda s: s.updated_at, reverse=True)\n        return\
    \ sessions\n\n    async def delete(self, session_id: str) -> bool:\n        \"\
    \"\"Delete a session.\n\n        Args:\n            session_id: Session to delete\n\
    \n        Returns:\n            True if deleted, False if not found\n        \"\
    \"\"\n        file_path = self.session_dir / f\"{session_id}.json\"\n\n      \
    \  if file_path.exists():\n            file_path.unlink()\n            return\
    \ True\n        return False\n\n    def exists(self, session_id: str) -> bool:\n\
    \        \"\"\"Check if session exists.\n\n        Args:\n            session_id:\
    \ Session identifier to check\n\n        Returns:\n            True if session\
    \ exists, False otherwise\n        \"\"\"\n        return (self.session_dir /\
    \ f\"{session_id}.json\").exists()\n\n    async def get_info(self, session_id:\
    \ str) -> SessionInfo | None:\n        \"\"\"Get session metadata without loading\
    \ full session.\n\n        Args:\n            session_id: Session identifier\n\
    \n        Returns:\n            SessionInfo if session exists, None otherwise\n\
    \        \"\"\"\n        file_path = self.session_dir / f\"{session_id}.json\"\
    \n\n        if not file_path.exists():\n            return None\n\n        try:\n\
    \            with open(file_path) as f:\n                data = json.load(f)\n\
    \n            return SessionInfo(\n                id=data[\"id\"],\n        \
    \        created_at=datetime.fromisoformat(data[\"created_at\"]),\n          \
    \      updated_at=datetime.fromisoformat(data[\"updated_at\"]),\n            \
    \    working_directory=data[\"working_directory\"],\n                message_count=len(data[\"\
    messages\"]),\n                model=data[\"model\"],\n                agent_type=data.get(\"\
    agent_type\", \"general\"),\n            )\n        except (json.JSONDecodeError,\
    \ KeyError):\n            return None\n"
