    \    Attributes:\n        message: Human-readable error message\n        code:\
    \ Error code for programmatic handling\n        statusCode: HTTP status code (optional)\n\
    \        help: Helpful hint for resolving the error (optional)\n    \"\"\"\n\n\
    \    def __init__(\n        self,\n        message: str,\n        code: str =\
