    \ ViewFileTool(BaseTool):\n    \"\"\"Tool for viewing file contents with line\
    \ numbers.\n\n    Attributes:\n        name: Tool identifier\n        description:\
    \ Human-readable description\n        input_schema: JSON Schema for input validation\n\
    \    \"\"\"\n\n    name = \"view_file\"\n    description = (\n        \"View a\
