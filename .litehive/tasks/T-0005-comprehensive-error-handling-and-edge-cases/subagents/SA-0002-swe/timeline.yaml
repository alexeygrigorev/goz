    \ display_range)\n            return result\n\n        except UnicodeDecodeError:\n\
    \            raise ToolExecutionError(f\"Binary file or encoding error: {file_path}\"\
    )\n\n    def _resolve_path(self, file_path: str) -> Path:\n        \"\"\"Resolve\
