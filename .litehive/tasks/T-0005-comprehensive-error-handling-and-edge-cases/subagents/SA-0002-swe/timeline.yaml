  tool_output: "\"\"\"Chat history management for the agent.\n\nThis module provides\
    \ classes for managing conversation history:\n- ChatMessage: Dataclass for individual\
    \ chat messages\n- ChatHistory: Container for managing message history with compression\n\
    \"\"\"\nfrom dataclasses import dataclass, field\nfrom datetime import datetime\n\
    from typing import Literal, Optional\n\n\n# Role types for chat messages (Acceptance\
    \ Criteria 5)\nMessageRole = Literal[\"user\", \"assistant\", \"tool\", \"tool_call\"\
    , \"agent_activity\"]\n\n\n@dataclass\nclass ToolCall:\n    \"\"\"Represents a\
    \ tool call in a message.\n\n    Attributes:\n        id: Unique identifier for\
