    \"\"\nimport os\nfrom datetime import datetime\nfrom pathlib import Path\n\nfrom\
    \ textual.app import App, ComposeResult\n\nfrom goz.agent.core import AgentCore\n\
    from goz.agent.history import ChatHistory\nfrom goz.agent.sessions import Session,\
    \ SessionManager\nfrom goz.agent.tui.screens.chat import ChatScreen\nfrom goz.config\
    \ import Config, load_config\n\n\nclass AgentApp(App[None]):\n    \"\"\"Main agent\
    \ TUI application.\n\n    Acceptance Criteria:\n    - AC 1: AgentApp class exists\
    \ in goz/agent/tui/app.py\n    - AC 2: Inherits from textual.app.App\n    - AC\
    \ 3: Registers ChatScreen and other screens\n    - AC 4: Initializes AgentCore\
    \ with config\n    - AC 5: Handles keyboard shortcuts (q=quit, /=slash commands)\n\
    \    - AC 6: Shows agent type in header\n    \"\"\"\n\n    TITLE = \"goz - Interactive\
    \ Coding Agent\"\n    MOUSE_SUPPORT = False  # Allow terminal text selection\n\
    \n    CSS = \"\"\"\n    Screen {\n        background: $background;\n        layout:\
    \ vertical;\n    }\n    ChatHistoryViewer {\n        height: 1fr;\n        padding:\
    \ 1;\n        background: $background;\n    }\n    MessageBox {\n        padding:\
    \ 1;\n        margin: 1 0;\n        background: $surface;\n    }\n    MessageBox.user\
    \ {\n        background: $primary 10%;\n    }\n    MessageBox.assistant {\n  \
    \      background: $success 10%;\n    }\n    ToolCallBox {\n        border: solid\
    \ $primary;\n        padding: 1;\n        margin: 1 0;\n    }\n    ToolResultBox\
    \ {\n        border: solid $accent;\n        padding: 1;\n        margin: 1 0;\n\
    \        background: $panel;\n    }\n    ChatInput {\n        height: 3;\n   \
    \     padding: 1;\n        background: $surface;\n    }\n    ThinkingIndicator\
    \ {\n        height: 1;\n    }\n    \"\"\"\n\n    SCREENS = {\n        \"chat\"\
    : ChatScreen,\n    }\n\n    BINDINGS = [\n        (\"ctrl+c\", \"quit\", \"Quit\"\
    ),\n    ]\n\n    def __init__(self, config: Config | None = None):\n        \"\
    \"\"Initialize AgentApp.\"\"\"\n        super().__init__()\n        self.config\
    \ = config or load_config()\n        self.agent = AgentCore(self.config)\n   \
    \     self.current_agent_type = \"general_purpose\"\n        self.session_id:\
    \ str | None = None\n        self.session_manager: SessionManager | None = None\n\
    \        self._session_dir: Path | None = None\n\n    def _get_session_dir(self)\
    \ -> Path:\n        \"\"\"Get the session directory for saving/loading sessions.\n\
    \n        Returns:\n            Path to the session directory\n        \"\"\"\n\
    \        if self._session_dir is None:\n            self._session_dir = Path.home()\
    \ / \".goz\" / \"sessions\"\n            self._session_dir.mkdir(parents=True,\
    \ exist_ok=True)\n        return self._session_dir\n\n    def on_mount(self) ->\
    \ None:\n        \"\"\"Mount chat screen on startup.\"\"\"\n        self.push_screen(\"\
    chat\")\n\n    def action_quit(self) -> None:\n        \"\"\"Quit the application.\n\
    \n        Acceptance Criteria:\n        - AC 5: Handles keyboard shortcuts (q=quit)\n\
    \        \"\"\"\n        self.exit()\n\n    async def load_session(self, session_id:\
    \ str) -> None:\n        \"\"\"Load a saved session.\n\n        Args:\n      \
    \      session_id: The session identifier to load\n\n        Raises:\n       \
    \     FileNotFoundError: If session doesn't exist\n        \"\"\"\n        # Initialize\
    \ session manager if needed\n        if self.session_manager is None:\n      \
    \      self.session_manager = SessionManager(session_dir=self._get_session_dir())\n\
    \n        # Load session from file\n        session = await self.session_manager.load(session_id)\n\
    \n        # Restore chat history\n        self.agent.history = ChatHistory(messages=session.messages)\n\
    \n        # Restore session metadata\n        self.session_id = session.id\n \
    \       self.current_agent_type = session.agent_type\n\n        # Note: working_directory\
    \ could be restored with os.chdir(session.working_directory)\n        # but we'll\
    \ skip that to avoid surprising the user\n\n    async def save_session(self, session_id:\
    \ str) -> None:\n        \"\"\"Save the current session.\n\n        Args:\n  \
    \          session_id: The session identifier to save\n        \"\"\"\n      \
    \  # Initialize session manager if needed\n        if self.session_manager is\
    \ None:\n            self.session_manager = SessionManager(session_dir=self._get_session_dir())\n\
    \n        # Create session object\n        now = datetime.now()\n        session\
    \ = Session(\n            id=session_id,\n            created_at=now,\n      \
