    \        logger.error(\"! TimeoutException: Request timed out after %dms\", timeout_ms)\n\
    \            raise TimeoutError(timeout_ms) from e\n        except httpx.ConnectError\
    \ as e:\n            if self.enable_logging:\n                logger.error(\"\
    ! NetworkError: %s\", e)\n            raise NetworkError(str(e)) from e\n    \
    \    except httpx.NetworkError as e:\n            if self.enable_logging:\n  \
    \              logger.error(\"! NetworkError: %s\", e)\n            raise NetworkError(str(e))\
    \ from e\n        except AuthError:\n            # Re-raise AuthError as-is\n\
    \            raise\n        except ZaiError:\n            # Re-raise other ZaiErrors\
    \ as-is\n            raise\n        except Exception as e:\n            if self.enable_logging:\n\
    \                logger.error(\"! %s: %s\", type(e).__name__, e)\n           \
    \ raise\n\n    def _handle_error_response(self, response: httpx.Response) -> None:\n\
    \        \"\"\"Handle error response from API.\n\n        Args:\n            response:\
    \ HTTP response object\n\n        Raises:\n            AuthError: For 401/403\
    \ responses\n            ApiError: For other error responses\n        \"\"\"\n\
    \        status_code = response.status_code\n\n        # Try to parse error message\
    \ from JSON\n        error_message = self._parse_error_message(response)\n\n \
    \       if self.enable_logging:\n            logger.error(\"! %d: %s\", status_code,\
    \ error_message)\n\n        # Raise appropriate error based on status code\n \
    \       if status_code in (401, 403):\n            raise AuthError(error_message,\
    \ statusCode=status_code)\n        else:\n            raise ApiError(error_message,\
    \ statusCode=status_code)\n\n    def _parse_error_message(self, response: httpx.Response)\
    \ -> str:\n        \"\"\"Parse error message from response.\n\n        Handles\
    \ nested error structures like:\n        - {\"error\": {\"message\": \"...\"}}\n\
    \        - {\"message\": \"...\"}\n        - {\"error\": \"...\"}\n\n        Args:\n\
    \            response: HTTP response object\n\n        Returns:\n            Extracted\
    \ error message\n        \"\"\"\n        try:\n            data = response.json()\n\
    \n            # Try nested error.message\n            if isinstance(data.get(\"\
    error\"), dict):\n                msg = data[\"error\"].get(\"message\")\n   \
    \             if msg:\n                    return msg if isinstance(msg, str)\
    \ else json.dumps(msg)\n\n            # Try top-level message\n            if\
    \ \"message\" in data:\n                msg = data[\"message\"]\n            \
    \    return msg if isinstance(msg, str) else json.dumps(msg)\n\n            #\
    \ Try error field\n            if \"error\" in data:\n                msg = data[\"\
    error\"]\n                return msg if isinstance(msg, str) else json.dumps(msg)\n\
    \n        except (json.JSONDecodeError, ValueError):\n            # Not JSON,\
    \ use text as-is\n            pass\n\n        return response.text or f\"HTTP\
    \ {response.status_code}\"\n"
