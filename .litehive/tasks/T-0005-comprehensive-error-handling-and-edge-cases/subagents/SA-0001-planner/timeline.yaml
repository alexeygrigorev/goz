  tool_output: "\"\"\"Error types for Z.AI API client.\n\nThese error types are used\
    \ throughout the API client for consistent error handling.\n\"\"\"\n\n\n\nclass\
    \ ZaiError(Exception):\n    \"\"\"Base error class for all Z.AI API errors.\n\n\
    \    Attributes:\n        message: Human-readable error message\n        code:\
    \ Error code for programmatic handling\n        statusCode: HTTP status code (optional)\n\
    \        help: Helpful hint for resolving the error (optional)\n    \"\"\"\n\n\
    \    def __init__(\n        self,\n        message: str,\n        code: str =\
    \ \"ZAI_ERROR\",\n        statusCode: int | None = None,\n        help: str |\
    \ None = None,\n    ) -> None:\n        \"\"\"Initialize ZaiError.\n\n       \
    \ Args:\n            message: Human-readable error message\n            code:\
    \ Error code for programmatic handling\n            statusCode: HTTP status code\
    \ (optional)\n            help: Helpful hint for resolving the error (optional)\n\
    \        \"\"\"\n        self.message = message\n        self.code = code\n  \
    \      self.statusCode = statusCode\n        self.help = help\n        super().__init__(self.message)\n\
    \n    def __str__(self) -> str:\n        \"\"\"Return string representation showing\
    \ error code and message.\"\"\"\n        return f\"[{self.code}] {self.message}\"\
    \n\n    def __repr__(self) -> str:\n        \"\"\"Return detailed string representation.\"\
    \"\"\n        return (\n            f\"{self.__class__.__name__}(message={self.message!r},\
    \ code={self.code!r}, \"\n            f\"statusCode={self.statusCode!r}, help={self.help!r})\"\
    \n        )\n\n\nclass AuthError(ZaiError):\n    \"\"\"Authentication/authorization\
    \ error (401, 403).\n\n    This error is raised when the API token is invalid,\
    \ expired, or missing.\n    \"\"\"\n\n    def __init__(self, message: str, statusCode:\
    \ int = 401) -> None:\n        \"\"\"Initialize AuthError.\n\n        Args:\n\
    \            message: Human-readable error message\n            statusCode: HTTP\
    \ status code (default: 401)\n        \"\"\"\n        super().__init__(\n    \
    \        message=message,\n            code=\"AUTH_ERROR\",\n            statusCode=statusCode,\n\
    \            help=\"Authentication failed. Check your API key in ~/.config/goz/config.json.\
    \ \"\n            \"Run 'goz config set zai_token <your-token>' to update.\",\n\
    \        )\n\n\nclass ApiError(ZaiError):\n    \"\"\"General API error (4xx, 5xx\
    \ responses).\n\n    This error is raised for API errors that are not authentication-related.\n\
    \    \"\"\"\n\n    def __init__(self, message: str, statusCode: int = 500) ->\
    \ None:\n        \"\"\"Initialize ApiError.\n\n        Args:\n            message:\
    \ Human-readable error message\n            statusCode: HTTP status code (default:\
    \ 500)\n        \"\"\"\n        super().__init__(\n            message=message,\n\
    \            code=\"API_ERROR\",\n            statusCode=statusCode,\n       \
    \ )\n\n\nclass NetworkError(ZaiError):\n    \"\"\"Network connection error.\n\n\
    \    This error is raised when the client cannot connect to the API server.\n\
    \    \"\"\"\n\n    def __init__(self, message: str) -> None:\n        \"\"\"Initialize\
    \ NetworkError.\n\n        Args:\n            message: Human-readable error message\n\
    \        \"\"\"\n        super().__init__(\n            message=message,\n   \
    \         code=\"NETWORK_ERROR\",\n            help=\"Network connection failed.\
    \ Check your internet connection and try again.\",\n        )\n\n\nclass TimeoutError(ZaiError):\n\
    \    \"\"\"Request timeout error.\n\n    This error is raised when the API request\
    \ takes too long to complete.\n    \"\"\"\n\n    def __init__(self, timeoutMs:\
    \ int) -> None:\n        \"\"\"Initialize TimeoutError.\n\n        Args:\n   \
    \         timeoutMs: Timeout value in milliseconds\n        \"\"\"\n        super().__init__(\n\
    \            message=f\"Request timed out after {timeoutMs}ms\",\n           \
    \ code=\"TIMEOUT_ERROR\",\n            help=\"Try again or increase timeout with\
    \ Z_AI_TIMEOUT env var\",\n        )\n\n\nclass ValidationError(ZaiError):\n \
    \   \"\"\"Validation error for invalid input parameters.\n\n    This error is\
    \ raised when input validation fails, such as invalid URLs,\n    invalid format\
    \ values, or other parameter validation issues.\n    \"\"\"\n\n    def __init__(self,\
    \ message: str) -> None:\n        \"\"\"Initialize ValidationError.\n\n      \
    \  Args:\n            message: Human-readable error message describing the validation\
    \ failure\n        \"\"\"\n        super().__init__(\n            message=message,\n\
    \            code=\"VALIDATION_ERROR\",\n            help=\"Check your input parameters\
    \ and try again.\",\n        )\n"
