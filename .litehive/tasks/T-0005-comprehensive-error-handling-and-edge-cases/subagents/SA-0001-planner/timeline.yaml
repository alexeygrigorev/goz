    type\": \"string\",\n                \"description\": \"Replacement text\"\n \
    \           }\n        },\n        \"required\": [\"file_path\", \"old_text\"\
    , \"new_text\"]\n    }\n\n    async def execute(\n        self,\n        file_path:\
    \ str,\n        old_text: str,\n        new_text: str,\n    ) -> str:\n      \
    \  \"\"\"Replace text in file.\n\n        Args:\n            file_path: Path to\
    \ the file to edit\n            old_text: Text to replace (must be unique in file)\n\
    \            new_text: Replacement text\n\n        Returns:\n            Diff-style\
    \ confirmation of changes\n\n        Raises:\n            ToolExecutionError:\
    \ If file not found or replacement fails\n        \"\"\"\n        # Resolve path\n\
    \        full_path = self._resolve_path(file_path)\n\n        # Check if file\
    \ exists\n        if not full_path.exists():\n            return f\"Error: File\
    \ not found: {file_path}\"\n\n        try:\n            # Read file content\n\
    \            content = full_path.read_text(encoding=\"utf-8\")\n\n           \
    \ # Check if old_text exists\n            if old_text not in content:\n      \
    \          return \"Error: Could not find the specified text to replace. It may\
    \ have changed.\"\n\n            # Check for multiple matches\n            count\
    \ = content.count(old_text)\n            if count > 1:\n                return\
    \ \"Error: Found multiple matches for the specified text. Include more context.\"\
    \n\n            # Perform replacement\n            new_content = content.replace(old_text,\
    \ new_text, 1)\n\n            # Write back\n            full_path.write_text(new_content,\
    \ encoding=\"utf-8\")\n\n            # Generate diff-style output\n          \
    \  return self._format_diff(file_path, old_text, new_text)\n\n        except PermissionError:\n\
    \            raise ToolExecutionError(f\"Permission denied: {file_path}\")\n \
    \       except OSError as e:\n            raise ToolExecutionError(f\"Failed to\
    \ edit file: {e}\")\n\n    def _resolve_path(self, file_path: str) -> Path:\n\
    \        \"\"\"Resolve file path relative to working directory.\n\n        Args:\n\
    \            file_path: File path (relative or absolute)\n\n        Returns:\n\
    \            Resolved absolute Path\n        \"\"\"\n        path = Path(file_path)\n\
    \n        # If relative, resolve against working_dir\n        if not path.is_absolute():\n\
    \            path = Path(self.working_dir) / path\n\n        return path.resolve()\n\
    \n    def _format_diff(self, file_path: str, old_text: str, new_text: str) ->\
    \ str:\n        \"\"\"Format diff-style output for replacement.\n\n        Args:\n\
    \            file_path: Path to the file\n            old_text: Original text\n\
    \            new_text: Replacement text\n\n        Returns:\n            Diff-style\
    \ output string\n        \"\"\"\n        output = []\n        output.append(f\"\
    Edited: {file_path}\")\n        output.append(\"\" + \"=\" * 60)\n        output.append(\"\
    \")\n\n        # Split into lines for diff display\n        old_lines = old_text.splitlines(keepends=True)\n\
    \        new_lines = new_text.splitlines(keepends=True)\n\n        # Show old\
    \ text with - prefix\n        for line in old_lines:\n            stripped = line.rstrip(\"\
    \\n\\r\")\n            output.append(f\"- {stripped}\")\n\n        # Show new\
    \ text with + prefix\n        for line in new_lines:\n            stripped = line.rstrip(\"\
    \\n\\r\")\n            output.append(f\"+ {stripped}\")\n\n        return \"\\\
    n\".join(output)\n"
