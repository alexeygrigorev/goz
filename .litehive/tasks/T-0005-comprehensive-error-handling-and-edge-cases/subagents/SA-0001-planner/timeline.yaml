  tool_output: "\"\"\"Base tool definitions for goz interactive coding agent.\n\n\
    This module provides:\n- Tool: Protocol defining the tool interface\n- BaseTool:\
    \ Base class with common functionality\n- Tool exception classes\n\"\"\"\nfrom\
    \ __future__ import annotations\n\nimport os\nfrom typing import Any, Protocol\n\
    \n\nclass ToolError(Exception):\n    \"\"\"Base error for tool operations.\"\"\
    \"\n\n    pass\n\n\nclass ToolInputError(ToolError):\n    \"\"\"Tool input validation\
    \ failed.\n\n    Raised when tool inputs do not match the expected schema.\n \
    \   \"\"\"\n\n    pass\n\n\nclass ToolNotFoundError(ToolError):\n    \"\"\"Tool\
    \ not found in registry.\n\n    Raised when attempting to retrieve a tool that\
    \ hasn't been registered.\n    \"\"\"\n\n    def __init__(self, tool_name: str)\
    \ -> None:\n        \"\"\"Initialize ToolNotFoundError.\n\n        Args:\n   \
    \         tool_name: Name of the tool that was not found\n        \"\"\"\n   \
    \     self.tool_name = tool_name\n        super().__init__(f\"Tool '{tool_name}'\
    \ not found\")\n\n\nclass ToolExecutionError(ToolError):\n    \"\"\"Tool execution\
    \ failed.\n\n    Raised when a tool's execute method encounters an error during\
    \ execution.\n    \"\"\"\n\n    pass\n\n\nclass Tool(Protocol):\n    \"\"\"Protocol\
    \ for agent tools.\n\n    A Tool is a callable unit that can be invoked by the\
    \ agent to perform\n    specific actions like reading files, running commands,\
    \ searching code, etc.\n\n    Attributes:\n        name: Unique identifier for\
    \ the tool\n        description: Human-readable description of what the tool does\n\
    \        input_schema: JSON Schema describing the expected input format\n    \"\
    \"\"\n\n    name: str\n    description: str\n    input_schema: dict\n\n    async\
    \ def execute(self, **kwargs: Any) -> str:\n        \"\"\"Execute the tool with\
    \ the given arguments.\n\n        Args:\n            **kwargs: Tool-specific arguments\
    \ matching input_schema\n\n        Returns:\n            String result to send\
    \ back to the API\n\n        Raises:\n            ToolInputError: If input validation\
    \ fails\n            ToolExecutionError: If execution fails\n        \"\"\"\n\
    \        ...\n\n\nclass BaseTool:\n    \"\"\"Base class for tools with common\
    \ functionality.\n\n    Provides working directory management and input validation\
    \ utilities\n    for tool implementations.\n\n    Attributes:\n        working_dir:\
    \ Current working directory for file operations\n    \"\"\"\n\n    def __init__(self,\
    \ working_dir: str | None = None) -> None:\n        \"\"\"Initialize BaseTool.\n\
    \n        Args:\n            working_dir: Working directory for file operations.\n\
    \                Defaults to current directory if not provided.\n        \"\"\"\
    \n        self.working_dir = working_dir or os.getcwd()\n\n    def validate_input(self,\
    \ schema: dict, data: dict) -> None:\n        \"\"\"Validate input against JSON\
    \ schema.\n\n        Performs basic validation checking for required fields and\
    \ types.\n        This is a simplified validator - production use should use\n\
    \        jsonschema library for full JSON Schema compliance.\n\n        Args:\n\
    \            schema: JSON Schema for validation\n            data: Input data\
    \ to validate\n\n        Raises:\n            ToolInputError: If validation fails\n\
    \        \"\"\"\n        if not isinstance(data, dict):\n            raise ToolInputError(\n\
    \                f\"Invalid input: expected object, got {type(data).__name__}\"\
    \n            )\n\n        # Check required fields\n        required = schema.get(\"\
    required\", [])\n        for field in required:\n            if field not in data:\n\
    \                raise ToolInputError(\n                    f\"Missing required\
    \ field: '{field}'\"\n                )\n\n        # Basic type checking for properties\n\
    \        properties = schema.get(\"properties\", {})\n        for field, value\
    \ in data.items():\n            if field not in properties:\n                continue\
    \  # Allow extra fields by default\n\n            prop_schema = properties[field]\n\
    \            expected_type = prop_schema.get(\"type\")\n\n            if expected_type\
    \ == \"string\":\n                if not isinstance(value, str):\n           \
    \         raise ToolInputError(\n                        f\"Field '{field}': expected\
    \ string, got {type(value).__name__}\"\n                    )\n            elif\
    \ expected_type == \"number\":\n                if not isinstance(value, (int,\
    \ float)):\n                    raise ToolInputError(\n                      \
    \  f\"Field '{field}': expected number, got {type(value).__name__}\"\n       \
    \             )\n            elif expected_type == \"integer\":\n            \
    \    if not isinstance(value, int):\n                    raise ToolInputError(\n\
    \                        f\"Field '{field}': expected integer, got {type(value).__name__}\"\
    \n                    )\n            elif expected_type == \"boolean\":\n    \
    \            if not isinstance(value, bool):\n                    raise ToolInputError(\n\
    \                        f\"Field '{field}': expected boolean, got {type(value).__name__}\"\
    \n                    )\n            elif expected_type == \"array\":\n      \
    \          if not isinstance(value, list):\n                    raise ToolInputError(\n\
    \                        f\"Field '{field}': expected array, got {type(value).__name__}\"\
    \n                    )\n                # Check item type if specified\n    \
    \            items_schema = prop_schema.get(\"items\", {})\n                item_type\
    \ = items_schema.get(\"type\")\n                if item_type:\n              \
    \      for i, item in enumerate(value):\n                        if item_type\
    \ == \"string\" and not isinstance(item, str):\n                            raise\
    \ ToolInputError(\n                                f\"Field '{field}[{i}]': expected\
    \ string, got {type(item).__name__}\"\n                            )\n       \
    \                 elif item_type == \"integer\" and not isinstance(item, int):\n\
    \                            raise ToolInputError(\n                         \
    \       f\"Field '{field}[{i}]': expected integer, got {type(item).__name__}\"\
    \n                            )\n\n            # Check min/max for arrays\n  \
    \          if expected_type == \"array\" and isinstance(value, list):\n      \
    \          min_items = prop_schema.get(\"minItems\")\n                max_items\
    \ = prop_schema.get(\"maxItems\")\n                if min_items is not None and\
    \ len(value) < min_items:\n                    raise ToolInputError(\n       \
    \                 f\"Field '{field}': minimum {min_items} items required, got\
    \ {len(value)}\"\n                    )\n                if max_items is not None\
    \ and len(value) > max_items:\n                    raise ToolInputError(\n   \
    \                     f\"Field '{field}': maximum {max_items} items allowed, got\
    \ {len(value)}\"\n                    )\n"
