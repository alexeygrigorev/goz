  tool_name: null
  tool_input: null
  tool_output: "\"\"\"File operation tools for goz interactive coding agent.\n\nThis\
    \ module provides tools for file operations including:\n- ViewFileTool: View file\
    \ contents with line numbers\n- CreateFileTool: Create new files with content\n\
    - StrReplaceEditorTool: Replace text in existing files\n\"\"\"\nfrom __future__\
    \ import annotations\n\nimport os\nfrom pathlib import Path\nfrom typing import\
    \ Any\n\nfrom goz.agent.tools.base import BaseTool, ToolExecutionError\n\n\nclass\
    \ ViewFileTool(BaseTool):\n    \"\"\"Tool for viewing file contents with line\
    \ numbers.\n\n    Attributes:\n        name: Tool identifier\n        description:\
    \ Human-readable description\n        input_schema: JSON Schema for input validation\n\
    \    \"\"\"\n\n    name = \"view_file\"\n    description = (\n        \"View a\
    \ file's contents with line numbers. \"\n        \"Use this to read existing files\
    \ and understand code structure. \"\n        \"For large files, use line_range\
    \ to focus on specific sections.\"\n    )\n    input_schema = {\n        \"type\"\
    : \"object\",\n        \"properties\": {\n            \"file_path\": {\n     \
    \           \"type\": \"string\",\n                \"description\": \"Path to\
    \ the file to view\"\n            },\n            \"line_range\": {\n        \
    \        \"type\": \"array\",\n                \"items\": {\"type\": \"integer\"\
    },\n                \"minItems\": 2,\n                \"maxItems\": 2,\n     \
    \           \"description\": \"Optional [start, end] line range (1-indexed, inclusive)\"\
    \n            }\n        },\n        \"required\": [\"file_path\"]\n    }\n\n\
    \    async def execute(\n        self,\n        file_path: str,\n        line_range:\
    \ list[int] | None = None,\n    ) -> str:\n        \"\"\"View file contents.\n\
    \n        Args:\n            file_path: Path to the file to view\n           \
    \ line_range: Optional [start, end] line range (1-indexed, inclusive)\n\n    \
    \    Returns:\n            Formatted file contents with line numbers\n\n     \
    \   Raises:\n            ToolExecutionError: If file not found or cannot be read\n\
    \        \"\"\"\n        # Resolve path\n        full_path = self._resolve_path(file_path)\n\
    \n        # Check if file exists\n        if not full_path.exists():\n       \
    \     raise ToolExecutionError(f\"File not found: {file_path}\")\n\n        #\
    \ Check if it's a file (not directory)\n        if not full_path.is_file():\n\
    \            raise ToolExecutionError(f\"Not a file: {file_path}\")\n\n      \
    \  try:\n            # Read file content\n            content = full_path.read_text(encoding=\"\
    utf-8\")\n            lines = content.splitlines(keepends=True)\n\n          \
    \  # Get total line count\n            total_lines = len(lines)\n\n          \
    \  # Apply line range if specified\n            if line_range is not None:\n \
    \               start, end = line_range\n                # Convert from 1-indexed\
    \ to 0-indexed\n                start_idx = max(0, start - 1)\n              \
    \  end_idx = min(total_lines, end)\n                lines = lines[start_idx:end_idx]\n\
    \                display_range = f\" (lines {start}-{end_idx})\"\n           \
    \ else:\n                display_range = \"\"\n\n            # Format output with\
    \ line numbers\n            result = self._format_output(full_path, lines, total_lines,\
    \ display_range)\n            return result\n\n        except UnicodeDecodeError:\n\
    \            raise ToolExecutionError(f\"Binary file or encoding error: {file_path}\"\
    )\n\n    def _resolve_path(self, file_path: str) -> Path:\n        \"\"\"Resolve\
    \ file path relative to working directory.\n\n        Args:\n            file_path:\
    \ File path (relative or absolute)\n\n        Returns:\n            Resolved absolute\
    \ Path\n        \"\"\"\n        path = Path(file_path)\n\n        # If relative,\
    \ resolve against working_dir\n        if not path.is_absolute():\n          \
    \  path = Path(self.working_dir) / path\n\n        return path.resolve()\n\n \
    \   def _format_output(\n        self,\n        file_path: Path,\n        lines:\
    \ list[str],\n        total_lines: int,\n        display_range: str = \"\"\n \
    \   ) -> str:\n        \"\"\"Format file output with line numbers.\n\n       \
    \ Args:\n            file_path: Path to the file\n            lines: List of file\
    \ lines\n            total_lines: Total number of lines in file\n            display_range:\
    \ Optional range suffix for display\n\n        Returns:\n            Formatted\
    \ output string\n        \"\"\"\n        # Calculate line number width\n     \
    \   start_line = 1 if not display_range else int(display_range.split(\"-\")[0].split()[1].rstrip(\"\
    )\"))\n        width = len(str(total_lines))\n\n        output = []\n        output.append(f\"\
    File: {file_path}{display_range} ({total_lines} lines)\")\n        output.append(\"\
    \" + \"=\" * 60)\n        output.append(\"\")\n\n        for i, line in enumerate(lines,\
    \ start=start_line):\n            line_num = f\"{i:>{width}}\u2192\"\n       \
    \     # Strip trailing newline for display\n            display_line = line.rstrip(\"\
    \\n\\r\")\n            output.append(f\"{line_num} {display_line}\")\n\n     \
    \   return \"\\n\".join(output)\n\n\nclass CreateFileTool(BaseTool):\n    \"\"\
    \"Tool for creating new files with content.\n\n    Attributes:\n        name:\
    \ Tool identifier\n        description: Human-readable description\n        input_schema:\
    \ JSON Schema for input validation\n    \"\"\"\n\n    name = \"create_file\"\n\
    \    description = (\n        \"Create a new file with content. \"\n        \"\
    Use this to create new source files, configs, etc. \"\n        \"If the file already\
    \ exists, this will fail.\"\n    )\n    input_schema = {\n        \"type\": \"\
    object\",\n        \"properties\": {\n            \"file_path\": {\n         \
    \       \"type\": \"string\",\n                \"description\": \"Path for the\
    \ new file\"\n            },\n            \"content\": {\n                \"type\"\
    : \"string\",\n                \"description\": \"Content to write to the file\"\
    \n            }\n        },\n        \"required\": [\"file_path\", \"content\"\
    ]\n    }\n\n    async def execute(self, file_path: str, content: str) -> str:\n\
    \        \"\"\"Create a new file.\n\n        Args:\n            file_path: Path\
    \ for the new file\n            content: Content to write to the file\n\n    \
    \    Returns:\n            Success message with file path\n\n        Raises:\n\
    \            ToolExecutionError: If file already exists or creation fails\n  \
    \      \"\"\"\n        # Resolve path\n        full_path = self._resolve_path(file_path)\n\
    \n        # Check if file already exists\n        if full_path.exists():\n   \
    \         return f\"Error: File already exists: {file_path}. Use str_replace_editor\
    \ to modify.\"\n\n        try:\n            # Create parent directories if needed\n\
    \            full_path.parent.mkdir(parents=True, exist_ok=True)\n\n         \
    \   # Write content\n            full_path.write_text(content, encoding=\"utf-8\"\
    )\n\n            return f\"Created: {file_path}\"\n\n        except PermissionError:\n\
    \            raise ToolExecutionError(f\"Permission denied: {file_path}\")\n \
    \       except OSError as e:\n            raise ToolExecutionError(f\"Failed to\
    \ create file: {e}\")\n\n    def _resolve_path(self, file_path: str) -> Path:\n\
    \        \"\"\"Resolve file path relative to working directory.\n\n        Args:\n\
    \            file_path: File path (relative or absolute)\n\n        Returns:\n\
    \            Resolved absolute Path\n        \"\"\"\n        path = Path(file_path)\n\
    \n        # If relative, resolve against working_dir\n        if not path.is_absolute():\n\
    \            path = Path(self.working_dir) / path\n\n        return path.resolve()\n\
    \n\nclass StrReplaceEditorTool(BaseTool):\n    \"\"\"Tool for replacing text in\
    \ existing files.\n\n    Attributes:\n        name: Tool identifier\n        description:\
    \ Human-readable description\n        input_schema: JSON Schema for input validation\n\
    \    \"\"\"\n\n    name = \"str_replace_editor\"\n    description = (\n      \
    \  \"Replace text in an existing file. \"\n        \"Best for making targeted\
    \ edits to existing code. \"\n        \"The old_text must be unique in the file\
    \ - use more context if needed.\"\n    )\n    input_schema = {\n        \"type\"\
    : \"object\",\n        \"properties\": {\n            \"file_path\": {\n     \
    \           \"type\": \"string\",\n                \"description\": \"Path to\
    \ the file to edit\"\n            },\n"
