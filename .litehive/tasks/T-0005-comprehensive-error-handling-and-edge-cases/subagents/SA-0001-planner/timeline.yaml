  tool_output: "\"\"\"Bash tool for executing shell commands (Issue 20).\n\nThis module\
    \ provides the BashTool class for safely executing shell commands\nwith support\
    \ for:\n- Async execution with timeout\n- Working directory specification\n- Cross-platform\
    \ shell handling (Windows, macOS, Linux)\n- Destructive command warnings\n- Output\
    \ streaming\n- Graceful cancellation handling\n\"\"\"\nfrom __future__ import\
    \ annotations\n\nimport asyncio\nimport os\nimport platform\nimport re\nimport\
    \ shutil\nimport time\nfrom dataclasses import dataclass\nfrom pathlib import\
    \ Path\nfrom typing import AsyncIterator\n\nfrom goz.agent.tools.base import BaseTool,\
    \ ToolExecutionError\n\n\n@dataclass\nclass BashResult:\n    \"\"\"Result of bash\
    \ command execution.\n\n    Attributes:\n        exit_code: Process exit code\
    \ (0 for success)\n        stdout: Standard output from the command\n        stderr:\
    \ Standard error output from the command\n        duration: Execution time in\
    \ seconds\n    \"\"\"\n\n    exit_code: int\n    stdout: str\n    stderr: str\n\
    \    duration: float\n\n\nclass BashTool(BaseTool):\n    \"\"\"Tool for executing\
    \ shell commands.\n\n    Provides safe async execution of shell commands with:\n\
    \    - Cross-platform support (Windows cmd, Unix shells)\n    - Timeout handling\n\
    \    - Working directory control\n    - Destructive command warnings\n    - Real-time\
    \ output streaming\n\n    Attributes:\n        name: Tool identifier (\"bash\"\
    )\n        description: Human-readable description\n        input_schema: JSON\
    \ Schema for tool inputs\n    \"\"\"\n\n    name = \"bash\"\n    description =\
    \ (\n        \"Execute shell commands. Use for running tests, building, \"\n \
    \       \"git operations, and other terminal tasks. Commands run in \"\n     \
    \   \"the current working directory unless specified.\"\n    )\n    input_schema\
    \ = {\n        \"type\": \"object\",\n        \"properties\": {\n            \"\
    command\": {\n                \"type\": \"string\",\n                \"description\"\
    : \"Shell command to execute\"\n            },\n            \"cwd\": {\n     \
    \           \"type\": \"string\",\n                \"description\": \"Working\
    \ directory (default: current directory)\"\n            },\n            \"timeout\"\
    : {\n                \"type\": \"integer\",\n                \"description\":\
    \ \"Timeout in seconds (default: 300)\"\n            }\n        },\n        \"\
    required\": [\"command\"]\n    }\n\n    # Destructive command patterns\n    DESTRUCTIVE_PATTERNS\
    \ = [\n        r\"rm\\s+-rf\\s+/\",          # rm -rf /\n        r\"rm\\s+-rf?\\\
    s+\\*\",        # rm -rf * or rm -f *\n        r\"rm\\s+-r\\s+\",            #\
    \ rm -r (with path)\n        r\"rm\\s+-rf\\s+\",           # rm -rf (with path)\n\
    \        r\"mv\\s+.*\\s+/\",           # mv to root\n        r\"dd\\s+if=\", \
    \             # dd command\n        r\"format\\s+\",             # Windows format\n\
    \        r\"del\\s+\",                # Windows delete\n    ]\n\n    def _resolve_cwd(self,\
    \ cwd: str | None) -> str:\n        \"\"\"Resolve cwd relative to the tool working\
    \ directory.\"\"\"\n        path = Path(cwd) if cwd is not None else Path(self.working_dir)\n\
    \        if not path.is_absolute():\n            path = Path(self.working_dir)\
    \ / path\n        return str(path.resolve())\n\n    def _get_shell_command(self)\
    \ -> list[str]:\n        \"\"\"Get appropriate shell command for platform.\n\n\
    \        Returns:\n            List of shell command and arguments (e.g., [\"\
    cmd\", \"/c\"] or [\"/bin/bash\", \"-c\"])\n        \"\"\"\n        if platform.system()\
    \ == \"Windows\":\n            return [\"cmd\", \"/c\"]\n        else:\n     \
    \       # Use user's shell if available\n            shell = os.environ.get(\"\
    SHELL\", shutil.which(\"bash\") or \"/bin/sh\")\n            return [shell, \"\
    -c\"]\n\n    def _is_destructive(self, command: str) -> bool:\n        \"\"\"\
    Check if command looks destructive.\n\n        Args:\n            command: Command\
    \ string to check\n\n        Returns:\n            True if command matches destructive\
    \ patterns\n        \"\"\"\n        command_lower = command.lower()\n        for\
    \ pattern in self.DESTRUCTIVE_PATTERNS:\n            if re.search(pattern, command_lower):\n\
    \                return True\n        return False\n\n    async def execute(\n\
    \        self,\n        command: str,\n        cwd: str | None = None,\n     \
    \   timeout: int = 300,\n    ) -> BashResult:\n        \"\"\"Execute shell command.\n\
    \n        Args:\n            command: Shell command to execute\n            cwd:\
    \ Working directory (uses working_dir if None)\n            timeout: Timeout in\
    \ seconds (default: 300)\n\n        Returns:\n            BashResult with exit_code,\
    \ stdout, stderr, and duration\n\n        Raises:\n            ToolExecutionError:\
    \ If command times out or execution fails\n        \"\"\"\n        self.validate_input(\n\
    \            self.input_schema,\n            {\"command\": command, **({\"cwd\"\
    : cwd} if cwd is not None else {}), \"timeout\": timeout},\n        )\n\n    \
    \    if timeout <= 0:\n            raise ToolExecutionError(\"Timeout must be\
    \ greater than 0 seconds\")\n\n        if self._is_destructive(command):\n   \
    \         raise ToolExecutionError(\n                \"Refusing to run destructive\
    \ command without confirmation\"\n            )\n\n        work_dir = self._resolve_cwd(cwd)\n\
    \n        # Get platform-appropriate shell command\n        shell_cmd = self._get_shell_command()\n\
    \        full_cmd = shell_cmd + [command]\n\n        # Start timing\n        start_time\
    \ = time.time()\n\n        try:\n            # Create subprocess\n           \
    \ proc = await asyncio.create_subprocess_exec(\n                *full_cmd,\n \
    \               cwd=work_dir,\n                stdout=asyncio.subprocess.PIPE,\n\
    \                stderr=asyncio.subprocess.PIPE,\n                env=os.environ.copy(),\n\
    \            )\n\n            # Wait for completion with timeout\n           \
    \ try:\n                stdout_bytes, stderr_bytes = await asyncio.wait_for(\n\
    \                    proc.communicate(),\n                    timeout=timeout,\n\
    \                )\n            except asyncio.TimeoutError:\n               \
    \ # Kill the process on timeout\n                proc.kill()\n               \
    \ await proc.wait()\n                duration = time.time() - start_time\n   \
    \             raise ToolExecutionError(\n                    f\"Command timed\
    \ out after {timeout}s: {command}\"\n                )\n\n            # Calculate\
    \ duration\n            duration = time.time() - start_time\n\n            # Decode\
    \ output\n            stdout = stdout_bytes.decode(\"utf-8\", errors=\"replace\"\
    )\n            stderr = stderr_bytes.decode(\"utf-8\", errors=\"replace\")\n\n\
    \            # Get exit code\n            exit_code = proc.returncode or 0\n\n\
    \            return BashResult(\n                exit_code=exit_code,\n      \
    \          stdout=stdout,\n                stderr=stderr,\n                duration=duration,\n\
    \            )\n\n        except FileNotFoundError:\n            raise ToolExecutionError(\n\
    \                f\"Shell not found: {shell_cmd[0]}. Please ensure your shell\
    \ is installed.\"\n            )\n        except PermissionError:\n          \
    \  raise ToolExecutionError(\n                f\"Permission denied executing command\
    \ in {work_dir}\"\n            )\n        except asyncio.CancelledError:\n   \
    \         # Handle graceful cancellation - kill process and propagate\n      \
    \      proc_var = locals().get('proc')\n            if proc_var is not None:\n\
    \                proc_var.kill()\n                await proc_var.wait()\n    \
    \        raise asyncio.CancelledError()\n        except Exception as e:\n    \
    \        raise ToolExecutionError(f\"Command execution failed: {e}\")\n\n    async\
    \ def execute_stream(\n        self,\n        command: str,\n        cwd: str\
    \ | None = None,\n    ) -> AsyncIterator[str]:\n        \"\"\"Execute command\
    \ and yield output line by line.\n\n        This method streams output as it's\
    \ produced, useful for\n        long-running commands or real-time display.\n\n\
    \        Args:\n            command: Shell command to execute\n            cwd:\
    \ Working directory (uses working_dir if None)\n\n        Yields:\n          \
    \  Output lines as they are produced\n\n        Raises:\n            ToolExecutionError:\
    \ If command execution fails\n        \"\"\"\n        self.validate_input(\n \
    \           self.input_schema,\n            {\"command\": command, **({\"cwd\"\
    : cwd} if cwd is not None else {})},\n        )\n\n        if self._is_destructive(command):\n\
    \            raise ToolExecutionError(\n                \"Refusing to run destructive\
    \ command without confirmation\"\n"
