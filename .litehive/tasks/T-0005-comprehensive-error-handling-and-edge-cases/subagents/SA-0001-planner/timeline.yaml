  tool_output: "\"\"\"Core agent class for interactive coding.\n\nThis module provides\
    \ the AgentCore class which is the main entry point\nfor the interactive coding\
    \ agent with full tool integration.\n\nAcceptance Criteria (Issue 22):\n1. AgentCore.process_turn()\
    \ implements full turn processing\n2. Process turn: user input -> API stream ->\
    \ tool calls -> results -> API -> response\n3. Tool execution is sequential (not\
    \ parallel)\n4. Multiple tool calls in one response work correctly\n5. Tool results\
    \ are formatted for API consumption\n6. Tool errors are caught and formatted\n\
    7. Tool timeouts are handled\n8. Streaming response yields text chunks for UI\n\
    9. Turn completes when API stops (no more tool calls)\n10. Chat history is updated\
    \ with all messages\n\"\"\"\nimport asyncio\nimport logging\nfrom typing import\
    \ Any, AsyncIterator\n\nfrom goz.agent.chat_client import ChatClient, Chunk\n\
    from goz.agent.history import ChatHistory, ChatMessage, ToolCall\nfrom goz.agent.tools\
    \ import ToolRegistry\nfrom goz.config import Config\n\n\nlogger = logging.getLogger(__name__)\n\
    \n# Completion marker for signaling turn completion to UI\nCOMPLETION_MARKER =\
    \ \"\\x00\"\n\n\nclass AgentCore:\n    \"\"\"Core agent class for interactive\
    \ coding.\n\n    This class implements the full agent loop with tool integration:\n\
    \    - User input -> API stream -> tool calls -> tool execution -> results ->\
    \ API -> response\n    - Handles multiple iterations (tool -> API -> tool -> API\
    \ -> response)\n    - Yields text chunks for real-time UI updates\n    - Manages\
    \ chat history with all messages\n\n    Attributes:\n        config: Configuration\
    \ for the agent\n        history: Chat history manager\n        tool_registry:\
    \ Registry of available tools\n        chat_client: Client for Z.AI Chat API\n\
    \        max_iterations: Maximum tool-API iterations to prevent infinite loops\n\
    \    \"\"\"\n\n    def __init__(\n        self,\n        config: Config,\n   \
    \     history: ChatHistory | None = None,\n        tool_registry: ToolRegistry\
    \ | None = None,\n        stream_processor: Any = None,\n        max_iterations:\
    \ int = 10,\n    ) -> None:\n        \"\"\"Initialize AgentCore.\n\n        Args:\n\
    \            config: Configuration object\n            history: Optional ChatHistory\
    \ (creates new if None)\n            tool_registry: Optional ToolRegistry (creates\
    \ new if None)\n            stream_processor: Optional stream processor (not used\
    \ in current implementation)\n            max_iterations: Maximum tool-API iterations\
    \ per turn (default: 10)\n        \"\"\"\n        self.config = config\n     \
    \   self.history = history if history is not None else ChatHistory()\n       \
    \ self.tool_registry = tool_registry if tool_registry is not None else ToolRegistry()\n\
    \        self.stream_processor = stream_processor\n        self.max_iterations\
    \ = max_iterations\n\n        # Initialize chat client\n        self.chat_client\
    \ = ChatClient(config=config)\n\n    async def process_turn(\n        self,\n\
    \        user_input: str,\n    ) -> AsyncIterator[str]:\n        \"\"\"Process\
    \ a user turn and yield streaming response.\n\n        This is the main agent\
    \ loop. It:\n        1. Adds user message to history\n        2. Loops (up to\
    \ max_iterations):\n           a. Calls API with current history\n           b.\
    \ Streams response to UI (yields text chunks)\n           c. Checks for tool calls\n\
    \           d. If no tool calls, breaks\n           e. Executes tools sequentially\n\
    \           f. Adds tool calls and results to history\n        3. Adds assistant\
    \ message to history\n        4. Yields completion marker\n\n        Args:\n \
    \           user_input: User's input message\n\n        Yields:\n            Text\
    \ chunks for real-time UI display, followed by COMPLETION_MARKER\n\n        Acceptance\
    \ Criteria:\n        - AC 1: Implements full turn processing\n        - AC 2:\
    \ user input -> API -> tools -> results -> API -> response\n        - AC 3: Sequential\
    \ tool execution\n        - AC 4: Multiple tool calls in one response work\n \
    \       - AC 5: Tool results formatted for API\n        - AC 6: Tool errors caught\
    \ and formatted\n        - AC 7: Tool timeouts handled\n        - AC 8: Yields\
    \ text chunks for UI\n        - AC 9: Completes when API stops\n        - AC 10:\
    \ History updated with all messages\n        \"\"\"\n        # Step 1: Add user\
    \ message to history\n        self.history.add(ChatMessage(role=\"user\", content=user_input))\n\
    \n        # Step 2: Main loop for tool-API iterations\n        for iteration in\
    \ range(self.max_iterations):\n            # Step 2a: Call API with current history\n\
    \            messages = self.history.to_api_format()\n            tools_schema\
    \ = self.tool_registry.to_openai_schema()\n\n            # Step 2b: Process stream\
    \ and yield text for UI\n            accumulated_chunks: list[Chunk] = []\n  \
    \          accumulated_text: list[str] = []\n\n            try:\n            \
    \    stream = self.chat_client.chat_completion(\n                    messages=messages,\n\
    \                    tools=tools_schema if tools_schema else None,\n         \
    \           tool_choice=\"auto\",\n                )\n\n                async\
    \ for chunk in stream:\n                    accumulated_chunks.append(chunk)\n\
    \n                    # Yield text for UI (AC 8)\n                    # ContentBlockDelta\
    \ has type=\"text_delta\" or type=\"input_json_delta\"\n                    if\
    \ hasattr(chunk, 'type') and chunk.type == \"text_delta\":\n                 \
    \       if hasattr(chunk, 'text') and chunk.text:\n                          \
    \  accumulated_text.append(chunk.text)\n                            yield chunk.text\n\
    \n                # Step 2c: Extract tool calls from stream\n                tool_calls\
    \ = await self._extract_tool_calls_from_chunks(accumulated_chunks)\n\n       \
    \         # Step 2d: Check for completion (no more tool calls)\n             \
    \   if not tool_calls:\n                    # No tools, turn is complete - add\
    \ assistant message to history\n                    assistant_text = \"\".join(accumulated_text)\n\
    \                    self.history.add(ChatMessage(role=\"assistant\", content=assistant_text))\n\
    \                    # Yield completion marker (AC 9)\n                    yield\
    \ COMPLETION_MARKER\n                    break\n\n                # Step 2e: Execute\
    \ tools sequentially (AC 3, AC 4)\n                for tool_call_dict in tool_calls:\n\
    \                    # Create tool call message (AC 10)\n                    tool_call_msg\
    \ = ChatMessage(\n                        role=\"tool_call\",\n              \
    \          content=f\"Called {tool_call_dict['name']}\",\n                   \
    \     tool_calls=[ToolCall(\n                            id=tool_call_dict['id'],\n\
    \                            name=tool_call_dict['name'],\n                  \
    \          input=tool_call_dict['input'],\n                        )],\n     \
    \               )\n                    self.history.add(tool_call_msg)\n\n   \
    \                 # Execute tool (AC 5, AC 6, AC 7)\n                    tool_result\
    \ = await self._execute_tool_call(tool_call_dict)\n\n                    # Add\
    \ tool result to history (AC 10)\n                    result_msg = ChatMessage(\n\
    \                        role=\"tool\",\n                        content=tool_result,\n\
    \                        tool_result_id=tool_call_dict['id'],\n              \
    \      )\n                    self.history.add(result_msg)\n\n               \
    \ # Step 2f: Loop continues with tool results in history\n\n            except\
    \ Exception as e:\n                # Handle API errors\n                logger.error(f\"\
    Error during turn processing: {e}\")\n                # Add error message and\
    \ yield completion\n                self.history.add(ChatMessage(role=\"assistant\"\
    , content=f\"Error: {e}\"))\n                yield COMPLETION_MARKER\n       \
    \         break\n\n    async def _extract_tool_calls_from_chunks(self, chunks:\
    \ list[Chunk]) -> list[dict]:\n        \"\"\"Extract tool calls from accumulated\
    \ stream chunks.\n\n        Args:\n            chunks: List of chunks from the\
    \ API stream\n\n        Returns:\n            List of tool_call dicts with id,\
    \ name, and input keys\n        \"\"\"\n        # Use the chat_client's method\
    \ if available\n        if hasattr(self.chat_client, 'extract_tool_calls'):\n\
    \            return await self.chat_client.extract_tool_calls(chunks)\n\n    \
    \    # Fallback: implement extraction here\n        import json\n\n        tool_calls:\
    \ list[dict] = []\n        current_tool: dict[str, Any] | None = None\n      \
    \  accumulated_json: list[str] = []\n\n        for chunk in chunks:\n        \
    \    # Check for ContentBlockStart with tool_use\n            if hasattr(chunk,\
    \ 'type') and chunk.type == \"tool_use\":\n                current_tool = {\n\
    \                    \"id\": getattr(chunk, 'id', ''),\n                    \"\
    name\": getattr(chunk, 'name', ''),\n                    \"input\": {},\n    \
    \            }\n                accumulated_json = []\n\n            # Check for\
    \ ContentBlockDelta with partial JSON\n            elif hasattr(chunk, 'type')\
    \ and chunk.type == \"input_json_delta\":\n                if hasattr(chunk, 'partial_json')\
    \ and chunk.partial_json:\n                    accumulated_json.append(chunk.partial_json)\n\
    \n            # Check for ContentBlockStop\n            elif hasattr(chunk, 'type')\
    \ and chunk.type == \"content_block_stop\":\n                if current_tool is\
    \ not None and accumulated_json:\n                    try:\n                 \
    \       json_str = \"\".join(accumulated_json)\n                        current_tool[\"\
    input\"] = json.loads(json_str)\n                    except json.JSONDecodeError:\n\
    \                        current_tool[\"input\"] = {\"raw\": \"\".join(accumulated_json)}\n\
    \                    tool_calls.append(current_tool)\n                    current_tool\
    \ = None\n                    accumulated_json = []\n\n        # Alternative extraction\
    \ path using ContentBlockStart type\n        for chunk in chunks:\n          \
    \  if hasattr(chunk, 'type') and hasattr(chunk, 'index'):\n                if\
    \ chunk.type == \"tool_use\" and not any(\n                    tc.get('id') ==\
    \ getattr(chunk, 'id', '') for tc in tool_calls\n                ):\n        \
    \            new_tool = {\n                        \"id\": getattr(chunk, 'id',\
    \ ''),\n                        \"name\": getattr(chunk, 'name', ''),\n      \
    \                  \"input\": {},\n                    }\n                   \
    \ # Find corresponding input_json_delta chunks\n                    for c in chunks:\n\
    \                        if (hasattr(c, 'index') and c.index == chunk.index and\n\
    \                            hasattr(c, 'type') and c.type == \"input_json_delta\"\
    ):\n                            if hasattr(c, 'partial_json') and c.partial_json:\n\
    \                                try:\n                                    current\
    \ = new_tool[\"input\"].get(\"_partial\", \"\")\n                            \
    \        current += c.partial_json\n                                    new_tool[\"\
    input\"] = json.loads(current)\n                                except json.JSONDecodeError:\n\
    \                                    new_tool[\"input\"] = {\"_partial\": current\
    \ + c.partial_json}\n                    if new_tool not in tool_calls:\n    \
    \                    tool_calls.append(new_tool)\n\n        return tool_calls\n\
    \n    async def _execute_tool_call(self, tool_call: dict) -> str:\n        \"\"\
    \"Execute a single tool call and return result.\n\n        This handles:\n   \
    \     - Finding the tool by name\n        - Executing with timeout\n        -\
    \ Catching and formatting errors\n\n        Args:\n            tool_call: Tool\
    \ call dict with id, name, and input\n\n        Returns:\n            String result\
    \ to send back to API\n\n        Acceptance Criteria:\n        - AC 5: Tool results\
    \ formatted for API\n        - AC 6: Tool errors caught and formatted\n      \
    \  - AC 7: Tool timeouts handled\n        \"\"\"\n        tool_name = tool_call.get('name',\
    \ '')\n        tool = self.tool_registry.get(tool_name)\n\n        if tool is\
    \ None:\n            return f\"Tool not found: {tool_name}\"\n\n        try:\n\
    \            # Execute with timeout (AC 7)\n            result = await asyncio.wait_for(\n\
    \                tool.execute(**tool_call.get('input', {})),\n               \
    \ timeout=300,  # 5 minutes\n            )\n            return str(result)\n\n\
    \        except asyncio.TimeoutError:\n            # Handle timeout (AC 7)\n \
    \           return f\"Tool {tool_name} timed out after 300 seconds\"\n\n     \
    \   except Exception as e:\n            # Catch and format errors (AC 6)\n   \
    \         logger.error(f\"Tool {tool_name} failed: {e}\")\n            return\
    \ f\"Tool {tool_name} failed: {e}\"\n\n    def __repr__(self) -> str:\n      \
    \  \"\"\"Return string representation of AgentCore.\"\"\"\n        return f\"\
    AgentCore(config={self.config!r}, messages={self.history.message_count})\"\n"
