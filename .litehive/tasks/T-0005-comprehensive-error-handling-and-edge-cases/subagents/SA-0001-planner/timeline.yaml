  tool_output: "\"\"\"Chat API Client for Z.AI (Issue 17).\n\nThis module provides\
    \ the ChatClient class for interacting with the Z.AI\nchat API using the Anthropic\
    \ SDK with tool calling support.\n\nAcceptance Criteria:\n1. ChatClient class\
    \ exists in goz/agent/chat_client.py\n2. Uses existing Anthropic SDK (same as\
    \ Vision API)\n3. Uses config.zai_token and config.zai_base_url\n4. chat_completion()\
    \ method sends messages and returns async iterator\n5. Supports tools parameter\
    \ for function calling\n6. Supports tool_choice parameter (\"auto\", \"any\")\n\
    7. Supports stream parameter (True/False)\n8. Response chunks yield text deltas\n\
    9. Tool calls are properly formatted in stream\n10. Errors raised as appropriate\
    \ exceptions (AuthError, ApiError, etc.)\n11. Timeout configurable via config\n\
    \"\"\"\nimport asyncio\nimport json\nfrom dataclasses import dataclass\nfrom typing\
    \ import AsyncIterator, Literal\n\nimport anthropic\nfrom anthropic import AsyncAnthropic\n\
    \nfrom goz.api.errors import AuthError, ApiError, NetworkError, TimeoutError,\
    \ ZaiError\nfrom goz.config import Config\n\n\n# Chunk types for streaming responses\
    \ (from spec)\n@dataclass\nclass ContentBlockStart:\n    \"\"\"Start of a content\
    \ block in the stream.\n\n    Attributes:\n        type: The type of content block\
    \ (\"text\" or \"tool_use\")\n        index: The index of this content block\n\
    \        id: Tool call ID (only for tool_use type)\n        name: Tool name (only\
    \ for tool_use type)\n    \"\"\"\n    type: Literal[\"text\", \"tool_use\"]\n\
    \    index: int\n    id: str | None = None\n    name: str | None = None\n\n\n\
    @dataclass\nclass ContentBlockDelta:\n    \"\"\"Delta for a content block in the\
    \ stream.\n\n    Attributes:\n        type: The type of delta (\"text_delta\"\
    \ or \"input_json_delta\")\n        index: The index of this content block\n \
    \       text: Text content (only for text_delta type)\n        partial_json: Partial\
    \ JSON string (only for input_json_delta type)\n    \"\"\"\n    type: Literal[\"\
    text_delta\", \"input_json_delta\"]\n    index: int\n    text: str | None = None\n\
    \    partial_json: str | None = None\n\n\n@dataclass\nclass ContentBlockStop:\n\
    \    \"\"\"End of a content block in the stream.\n\n    Attributes:\n        index:\
    \ The index of this content block\n    \"\"\"\n    index: int\n\n\n@dataclass\n\
    class MessageStart:\n    \"\"\"Start of the message.\n\n    Attributes:\n    \
    \    id: Message ID\n        model: Model name\n    \"\"\"\n    id: str\n    model:\
    \ str\n\n\n@dataclass\nclass MessageStop:\n    \"\"\"End of the message.\n\n \
    \   Attributes:\n        stop_reason: Reason for stopping (\"end_turn\", \"max_tokens\"\
    , \"tool_use\")\n    \"\"\"\n    stop_reason: Literal[\"end_turn\", \"max_tokens\"\
    , \"tool_use\"]\n\n\n# Union type for all chunk types\nChunk = ContentBlockStart\
    \ | ContentBlockDelta | ContentBlockStop | MessageStart | MessageStop\n\n\nclass\
    \ ChatClient:\n    \"\"\"Client for Z.AI Chat API with tool calling support.\n\
    \n    This client uses the Anthropic SDK to interact with the Z.AI chat API,\n\
    \    supporting streaming responses, tool calling, and various generation\n  \
    \  parameters.\n\n    Attributes:\n        config: Configuration object containing\
    \ API credentials and settings\n        _client: Internal AsyncAnthropic client\
    \ instance\n    \"\"\"\n\n    def __init__(self, config: Config | None = None)\
    \ -> None:\n        \"\"\"Initialize ChatClient.\n\n        Args:\n          \
    \  config: Optional config object. If not provided, loads from default location.\n\
    \n        Acceptance Criteria:\n        - Uses config.zai_token and config.zai_base_url\
    \ (AC 3)\n        - Uses AsyncAnthropic from existing SDK (AC 2)\n        - Timeout\
    \ is configurable via config (AC 11)\n        \"\"\"\n        if config is None:\n\
    \            from goz.config import load_config\n            config = load_config()\n\
    \n        self.config = config\n\n        # Initialize async Anthropic client\
    \ (same pattern as VisionClient)\n        self._client = AsyncAnthropic(\n   \
    \         api_key=self.config.zai_token,\n            base_url=self.config.zai_base_url,\n\
    \            timeout=self.config.timeout,\n        )\n\n    async def chat_completion(\n\
    \        self,\n        messages: list[dict],\n        tools: list[dict] | None\
    \ = None,\n        tool_choice: Literal[\"auto\", \"any\", \"none\"] | dict =\
    \ \"auto\",\n        stream: bool = True,\n        temperature: float | None =\
    \ None,\n        max_tokens: int | None = None,\n    ) -> AsyncIterator[Chunk]:\n\
    \        \"\"\"Stream chat completion with tool calling support.\n\n        Args:\n\
    \            messages: Chat history in Anthropic format\n            tools: Tool\
    \ definitions in Anthropic format (optional)\n            tool_choice: How to\
    \ select tools (\"auto\", \"any\", \"none\", or specific tool dict)\n        \
    \    stream: Whether to stream response (True) or wait for complete response (False)\n\
    \            temperature: Generation temperature (uses config default if None)\n\
    \            max_tokens: Max tokens in response (uses config default if None)\n\
    \n        Yields:\n            Chunk objects from the API response\n\n       \
    \ Raises:\n            AuthError: For 401/403 authentication failures\n      \
    \      ApiError: For other API errors (4xx, 5xx)\n            NetworkError: For\
    \ connection failures\n            TimeoutError: For request timeouts\n\n    \
    \    Acceptance Criteria:\n        - Returns async iterator (AC 4)\n        -\
    \ Supports tools parameter (AC 5)\n        - Supports tool_choice parameter (AC\
    \ 6)\n        - Supports stream parameter (AC 7)\n        - Response chunks yield\
    \ text deltas (AC 8)\n        - Tool calls properly formatted in stream (AC 9)\n\
    \        - Errors raised as appropriate exceptions (AC 10)\n        \"\"\"\n \
    \       # Build request parameters\n        params: dict = {\n            \"model\"\
    : self.config.chat_model,\n            \"messages\": messages,\n        }\n\n\
    \        # Add optional parameters\n        if tools is not None:\n          \
    \  params[\"tools\"] = tools\n\n        if tool_choice != \"auto\":\n        \
    \    params[\"tool_choice\"] = tool_choice\n\n        if temperature is not None:\n\
    \            params[\"temperature\"] = temperature\n        else:\n          \
    \  params[\"temperature\"] = self.config.temperature\n\n        if max_tokens\
    \ is not None:\n            params[\"max_tokens\"] = max_tokens\n        else:\n\
    \            params[\"max_tokens\"] = self.config.max_tokens\n\n        try:\n\
    \            if stream:\n                # Streaming mode\n                async\
    \ with self._client.messages.stream(**params) as stream:\n                   \
    \ async for event in stream:\n                        chunk = self._convert_sse_event_to_chunk(event)\n\
    \                        if chunk is not None:\n                            yield\
    \ chunk\n            else:\n                # Non-streaming mode - convert response\
    \ to chunks\n                response = await self._client.messages.create(**params)\n\
    \                async for chunk in self._response_to_chunks(response):\n    \
    \                yield chunk\n\n        except anthropic.AuthenticationError as\
    \ e:\n            raise AuthError(str(e))\n        except anthropic.APITimeoutError\
    \ as e:\n            raise TimeoutError(timeoutMs=int(self.config.timeout * 1000))\n\
    \        except anthropic.APIConnectionError as e:\n            raise NetworkError(str(e))\n\
    \        except anthropic.APIStatusError as e:\n            raise ApiError(str(e),\
    \ statusCode=e.status_code)\n        except Exception as e:\n            raise\
    \ ZaiError(f\"Unexpected error: {e}\")\n\n    def _convert_sse_event_to_chunk(self,\
    \ event: anthropic.types.RawMessageStreamEvent) -> Chunk | None:\n        \"\"\
    \"Convert Anthropic SSE event to our Chunk type.\n\n        Args:\n          \
    \  event: Raw SSE event from Anthropic SDK\n\n        Returns:\n            Chunk\
    \ object or None if event type not handled\n        \"\"\"\n        event_type\
    \ = event.type\n\n        if event_type == \"message_start\":\n            return\
    \ MessageStart(\n                id=event.message.id,\n                model=event.message.model,\n\
    \            )\n\n        elif event_type == \"content_block_start\":\n      \
    \      content_block = event.content_block\n            if content_block.type\
    \ == \"text\":\n                return ContentBlockStart(\n                  \
    \  type=\"text\",\n                    index=event.index,\n                )\n\
    \            elif content_block.type == \"tool_use\":\n                return\
    \ ContentBlockStart(\n                    type=\"tool_use\",\n               \
    \     index=event.index,\n                    id=content_block.id,\n         \
    \           name=content_block.name,\n                )\n\n        elif event_type\
    \ == \"content_block_delta\":\n            delta = event.delta\n            if\
    \ delta.type == \"text_delta\":\n                return ContentBlockDelta(\n \
    \                   type=\"text_delta\",\n                    index=event.index,\n\
    \                    text=delta.text,\n                )\n"
