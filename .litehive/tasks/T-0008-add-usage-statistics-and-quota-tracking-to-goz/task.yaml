goal: Track and display Z.AI token usage, costs, and quota limits. (1) Capture per-request
  usage from Anthropic SDK streaming responses (message_start.usage, message_delta.usage).
  (2) Call Z.AI monitor endpoints (api.z.ai/api/monitor/usage/quota/limit and model-usage)
  for quota dashboard. (3) Emit usage in JSONL step_finish events so litehive can
  track it. (4) Add a 'goz usage' CLI command showing current session tokens, 5-hour
  quota remaining, and 7/30-day aggregates.
acceptance_criteria:
- chat_client.py extracts usage.input_tokens and usage.output_tokens from streaming
  message_start/message_delta events
- Per-turn token counts accumulated in session state
- step_finish JSONL event includes tokens (input, output, cache_read, cache_write)
  and cost
- goz usage command calls api.z.ai/api/monitor/usage/quota/limit and displays 5-hour
  quota remaining
- goz usage command calls api.z.ai/api/monitor/usage/model-usage and shows 7-day and
  30-day aggregates
- goz run shows per-turn token usage in JSONL output compatible with litehive EngineUsageObservation
- Quota/rate limit errors (Z.AI codes 1302/1305/1308/1310) are detected and reported
  clearly
