goal: Implement session save/restore so goz can be resumed mid-conversation by litehive.
  Support resume_session_id parameter in CLI. Persist messages, tool state, working
  directory, and agent type to disk. Resume loads state and continues from where it
  left off.
acceptance_criteria:
- Session state serialized to JSON on disk
- goz run --resume-session <id> continues from saved state
- 'Persists: messages, tool results, working dir, agent type'
- Session auto-saved on clean exit and interruption (SIGTERM)
- Session ID returned in JSONL output for litehive to capture
- Compatible with litehive RuntimeEngineContinuation protocol
